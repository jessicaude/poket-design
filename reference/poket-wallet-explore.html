<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poket Wallet · Home exploration</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#eef2f0; --surface:#ffffff; --ink:#0d1512; --ink-2:#56605c; --ink-3:#8a948f; --line:#e4e9e6; --soft:#f2f5f3;
  --brand:#0a5c48; --brand-deep:#063a2d; --brand-tint:#e3f0eb; --pos:#0d9147; --warn:#b26b00;
  --r-panel:28px; --r-item:16px; --font:'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif; --mono:'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
[data-mode="dark"]{
  --canvas:#0b0f0d; --surface:#121816; --ink:#f1f5f3; --ink-2:#b4bdb9; --ink-3:#7c8783; --line:#1f2724; --soft:#1a211e;
  --brand:#5fd0ac; --brand-deep:#1f3b33; --brand-tint:#1c2c27;
}
*{box-sizing:border-box} html,body{margin:0}
body{font-family:var(--font);background:var(--canvas);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;transition:background .2s}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}

/* exploration controls (not part of the design) */
.ctl{position:fixed;top:16px;left:16px;display:flex;gap:8px;z-index:20;font-size:12.5px}
.ctl .seg{display:flex;background:#fff;border:1px solid #d7ddda;border-radius:999px;padding:3px}
[data-mode="dark"] .ctl .seg{background:#1a211e;border-color:#2a332f}
.ctl button{border:0;background:none;padding:6px 12px;border-radius:999px;color:var(--ink-2)}
.ctl button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.ctl-note{position:fixed;bottom:16px;left:16px;font-size:12px;color:var(--ink-3)}

/* the widget */
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:72px 16px 40px}
.panel{width:390px;height:780px;background:var(--surface);border-radius:var(--r-panel);box-shadow:0 1px 2px rgba(0,0,0,.04),0 24px 60px rgba(15,40,30,.12);position:relative;overflow:hidden;display:flex;flex-direction:column}
.scroll{flex:1;overflow:auto;padding:0 22px 24px;scrollbar-width:none} .scroll::-webkit-scrollbar{display:none}

.top{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 6px}
.who{display:flex;align-items:center;gap:10px;border:0;background:none;padding:4px 6px 4px 0;border-radius:12px}
.who .av{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.02em}
.who b{font-size:16px;font-weight:600}
.who svg{color:var(--ink-3)}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:none;display:grid;place-items:center;position:relative}
.icon-btn:hover{background:var(--soft)}
.dot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:#e5484d;border:2px solid var(--surface)}

.bal{padding:14px 0 22px}
.bal-lbl{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--ink-2);margin-bottom:6px}
.bal-row{display:flex;align-items:center;gap:8px}
.bal-amt{font-family:var(--mono);font-size:44px;line-height:1.05;font-weight:700;letter-spacing:-.04em;white-space:nowrap}
.bal-amt .cc{margin-left:.32em;font-size:.58em;font-weight:600;color:var(--ink-3);letter-spacing:-.01em}
.eye{border:0;background:none;color:var(--ink-3);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;margin-left:-2px}
.eye:hover{background:var(--soft);color:var(--ink-2)}
.bal-sub{margin-top:6px;font-size:13.5px;color:var(--ink-2)}

.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:0 8px 22px}
.act{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 0;font-size:13px;font-weight:600}
.act .c{width:58px;height:58px;border-radius:50%;background:var(--brand-deep);color:#fff;display:grid;place-items:center;transition:transform .12s var(--ease)}
.act:active .c{transform:scale(.94)}
[data-mode="dark"] .act .c{background:#e9f1ee;color:#0b0f0d}

.setup{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1.5px solid var(--line);background:none;border-radius:20px;padding:16px 16px 16px 18px;margin-bottom:26px}
.setup b{display:block;font-size:15.5px;font-weight:650;color:var(--ink)}
.setup span{display:block;font-size:13px;color:var(--ink-2);margin-top:2px}
.setup .ring{margin-left:auto;flex:none}

h2{font-size:18px;font-weight:700;letter-spacing:-.01em;margin:0 0 6px}
.list{margin:0 0 22px}
.row{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:12px 0;text-align:left}
.ico{width:40px;height:40px;flex:none;position:relative}
.ico img,.ico svg{width:40px;height:40px;border-radius:50%;display:block}
.ico .net{position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:50%;border:2px solid var(--surface);background:var(--surface)}
.ico .net img,.ico .net svg{width:100%!important;height:100%!important;border-radius:50%}
.ico .count{position:absolute;right:-4px;bottom:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-size:11px;font-weight:700;display:grid;place-items:center;color:var(--ink-2)}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:15.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm span{display:block;font-size:13px;color:var(--ink-3);margin-top:1px;font-variant-numeric:tabular-nums}
.val{text-align:right;font-variant-numeric:tabular-nums}
.val b{display:block;font-family:var(--mono);font-size:14.5px;font-weight:600;letter-spacing:-.02em}
.val span{display:block;font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-top:2px;letter-spacing:-.01em}
.chev{color:var(--ink-3);transition:transform .2s var(--ease);flex:none}
.row[aria-expanded="true"] .chev{transform:rotate(180deg)}
.group{background:var(--soft);border-radius:var(--r-item);padding:2px 14px;margin:2px -14px 6px;overflow:hidden}
.group .row{padding:11px 0}
.group .row+.row{border-top:1px solid var(--line)}
.nm .chip{display:inline-block;margin-top:0;font-size:11.5px;color:var(--ink-2)}
.chip{display:inline-block;font-size:11.5px;font-weight:600;color:var(--ink-2);border:1px solid var(--line);border-radius:7px;padding:1px 7px;margin-left:6px;vertical-align:1px;background:var(--surface)}

.month{font-size:13px;color:var(--ink-3);margin:6px 0 2px;font-weight:500}
.tx .ico .tico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.ico .tico svg{width:18px;height:18px;border-radius:0}
.tico.in{background:#e3f4ea;color:var(--pos)} .tico.out{background:var(--soft);color:var(--ink-2)}
[data-mode="dark"] .tico.in{background:#173326}
.tx .val b.pos{color:var(--pos)}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:26px 0 8px}
.empty .ei{width:64px;height:64px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--ink-3);margin-bottom:12px}
.empty b{font-size:15.5px}
.empty button{margin-top:14px;border:0;background:var(--brand-tint);color:var(--brand);font-weight:650;padding:10px 18px;border-radius:999px}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--surface);padding:8px 0 14px}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--ink-3)}
.tab[aria-current="page"]{color:var(--ink)}

/* menu + sheets */
.menu{position:absolute;top:62px;right:18px;width:220px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 40px rgba(0,0,0,.14);padding:6px;z-index:8;transform-origin:top right;animation:pop .16s var(--ease)}
.menu button{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;padding:12px 12px;border-radius:12px;font-size:15px;font-weight:600}
.menu button:hover{background:var(--soft)}
.menu .mdot{width:8px;height:8px;border-radius:50%;background:#e5484d;margin-left:auto;margin-right:10px}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.scrim{position:absolute;inset:0;background:rgba(10,16,13,.32);z-index:9;animation:fade .16s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 22px 22px;z-index:10;animation:up .22s var(--ease)}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 14px}
.sheet h3{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0 0 10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;padding:13px 0;text-align:left}
.opt+.opt{border-top:1px solid var(--line)}
.opt .oi{width:44px;height:44px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none}
.opt b{display:block;font-size:15.5px;font-weight:650;color:var(--ink)}
.opt span{display:block;font-size:13px;color:var(--ink-3);margin-top:1px}
.opt .chev{margin-left:auto}
.toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--surface);font-size:13px;font-weight:600;padding:10px 14px;border-radius:12px;z-index:12;white-space:nowrap;animation:fade .16s}
.masked{letter-spacing:.08em}
/* flow screens */
.bar{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;padding:16px 14px 8px}
.bar h1{margin:0;text-align:center;font-size:17px;font-weight:700;letter-spacing:-.01em}
.back{width:40px;height:40px;border-radius:50%;border:0;background:none;display:grid;place-items:center}
.back:hover{background:var(--soft)}
.body{flex:1;overflow:auto;padding:8px 22px 18px;display:flex;flex-direction:column;scrollbar-width:none} .body::-webkit-scrollbar{display:none}
.body>*{flex-shrink:0} .body>.amt-wrap{flex-shrink:1}
.found b{color:var(--ink)}
.foot{padding:12px 22px 22px}
.cta{width:100%;height:54px;border:0;border-radius:16px;background:var(--brand-deep);color:#fff;font-size:16px;font-weight:700;transition:transform .12s var(--ease),opacity .15s}
.cta:active{transform:scale(.985)} .cta:disabled{opacity:.35;cursor:not-allowed}
[data-mode="dark"] .cta{background:#e9f1ee;color:#0b0f0d}
.field{width:100%;height:56px;border:0;border-radius:16px;background:var(--soft);padding:0 16px;font:inherit;font-size:16px;color:var(--ink);outline:none;transition:box-shadow .15s}
.field:focus{box-shadow:inset 0 0 0 2px var(--brand)}
.field::placeholder{color:var(--ink-3)}
.fwrap{position:relative;margin-bottom:10px} .fwrap .field{padding-right:52px}
.fwrap .in-ic{position:absolute;right:8px;top:8px;width:40px;height:40px;border-radius:12px;border:0;background:none;display:grid;place-items:center;color:var(--ink-3)}
.lbl{font-size:13px;font-weight:600;color:var(--ink-2);margin:6px 0 8px}
.err{font-size:13px;color:#d0353a;margin:-2px 0 10px}
.found{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--brand-tint);margin-bottom:10px}
.found .av{width:38px;height:38px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.found b{display:block;font-size:15px} .found span{display:block;font-size:12.5px;color:var(--ink-2)}
.pick{display:flex;align-items:center;gap:12px;width:100%;height:60px;border:0;border-radius:16px;background:var(--soft);padding:0 14px;text-align:left;margin-bottom:10px}
.pick .ico{width:34px;height:34px} .pick .ico img,.pick .ico svg{width:34px;height:34px}
.pick .ico .net{width:16px;height:16px}
.pick b{font-size:16px;font-weight:650}
.pick .chev{margin-left:auto}
.addr{font-family:var(--mono);font-size:14.5px;line-height:1.5;word-break:break-all;letter-spacing:-.01em}
.addr em{font-style:normal;color:var(--brand);font-weight:700}
.amt-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:220px}
.amt{display:flex;align-items:baseline;justify-content:center;max-width:100%}
.amt input{font-family:var(--mono);font-weight:700;font-size:52px;letter-spacing:-.04em;border:0;background:none;color:var(--ink);outline:none;text-align:right;width:3ch;min-width:1ch;max-width:270px;padding:0}
.amt .sym{font-family:var(--mono);font-weight:700;font-size:52px;letter-spacing:-.04em;margin-right:-.12em}
.amt .cc{font-family:var(--mono);font-size:.58em;font-weight:600;color:var(--ink-3);margin-left:.32em;font-size:30px}
.from{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:none;border-radius:999px;padding:7px 12px 7px 8px;font-size:13.5px;font-weight:600}
.from .ico{width:22px;height:22px} .from .ico img,.from .ico svg{width:22px;height:22px}
.from .muted{color:var(--ink-3);font-weight:500;font-family:var(--mono);font-size:12.5px}
.from.static{cursor:default}
.max{border:0;background:var(--brand-tint);color:var(--brand);font-weight:700;font-size:12.5px;padding:7px 12px;border-radius:999px}
.sum{border-radius:18px;background:var(--soft);padding:4px 16px;margin-top:6px}
.sum .r{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:13px 0;font-size:14.5px}
.sum .r+.r{border-top:1px solid var(--line)}
.sum .r span:first-child{color:var(--ink-2)}
.sum .r b{font-weight:650;text-align:right}
.sum .r .mono{font-family:var(--mono);font-weight:600;letter-spacing:-.02em}
.sum .r.total b{font-size:16px}
.ok-line{font-size:13px;font-weight:600;color:var(--brand);margin:8px 0 12px}
.speeds{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.spd{border:1.5px solid var(--line);background:none;border-radius:14px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.spd b{font-size:14px} .spd span{font-family:var(--mono);font-size:12.5px;font-weight:600} .spd small{font-size:11.5px;color:var(--ink-3);line-height:1.3}
.spd.on{border-color:var(--brand);background:var(--brand-tint)}
.newrow .tico.plus{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--brand-tint);color:var(--brand)} .newrow .tico.plus svg{width:20px;height:20px;border-radius:0}
.newrow b{color:var(--brand)}
.pend{color:var(--warn);font-weight:600} .nm .pend{display:inline}
.cta.plaid{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px}
.or{display:flex;align-items:center;gap:12px;margin:18px 0 6px;color:var(--ink-3);font-size:13px} .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.spinner{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.curs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:2px 0 14px}
.cur{display:flex;align-items:center;justify-content:center;gap:6px;height:44px;border-radius:14px;border:1.5px solid var(--line);background:none;font-weight:700;font-size:14px}
.cur .fl{width:20px;height:20px;border-radius:50%;overflow:hidden;display:inline-flex} .cur .fl img,.cur .fl svg{width:20px;height:20px}
.cur.on{border-color:var(--brand);background:var(--brand-tint)}
.details .r b{display:flex;align-items:center;gap:8px}
.cp{width:30px;height:30px;border-radius:9px;border:0;background:var(--surface);display:grid;place-items:center;color:var(--ink-2);flex:none}
.cp svg{width:16px;height:16px}
.ftag{display:inline-flex;align-items:center;gap:4px;margin-top:3px;border:0;background:#fff4e0;color:#9a5b00;font:700 10.5px var(--font);letter-spacing:.02em;padding:2px 7px;border-radius:6px;cursor:help}
.ftag.static{margin:0;cursor:default}
[data-mode="dark"] .ftag{background:#3a2a10;color:#f5c06b}
.cvp{background:var(--soft);border-radius:20px;padding:14px 16px 16px;display:flex;flex-direction:column;align-items:center}
.cvp-top{display:flex;justify-content:space-between;width:100%;font-size:13px;color:var(--ink-2);font-weight:600}
.avail{border:0;background:none;color:var(--brand);font:600 12.5px var(--mono);padding:0}
.cv-asset{display:flex;align-items:center;gap:8px;border:0;background:var(--surface);border-radius:999px;padding:6px 10px 6px 6px;margin:10px 0 6px;font-size:15px}
.cv-asset .ico{width:28px;height:28px} .cv-asset .ico img,.cv-asset .ico svg{width:28px;height:28px} .cv-asset .ico .net{width:14px;height:14px;right:-3px;bottom:-3px}
.amt.cv input,.amt.cv .sym{font-size:40px} .amt.cv .sym{margin-right:-.06em} .amt.cv .cc{font-size:22px}
.swap{width:44px;height:44px;border-radius:50%;border:4px solid var(--surface);background:var(--brand-deep);color:#fff;display:grid;place-items:center;margin:-14px auto;position:relative;z-index:2;transition:transform .2s var(--ease)}
.swap:hover{transform:rotate(180deg)} .swap svg{width:20px;height:20px}
[data-mode="dark"] .swap{background:#e9f1ee;color:#0b0f0d}
.cvp.to{padding-top:20px}
.cv-get{font-family:var(--mono);font-weight:700;font-size:32px;letter-spacing:-.04em;margin-top:4px}
.cv-get .cc{font-size:.58em;font-weight:600;color:var(--ink-3);margin-left:.32em}
.pick-sub{font-size:13.5px;color:var(--ink-3);margin-left:2px}
.pick .ico.cardico{width:34px;height:24px} .pick .ico.cardico svg{width:34px;height:24px;border-radius:4px}
.oi.plus{background:var(--brand-tint)!important;color:var(--brand)}
.fwrap .in-ic svg{width:34px;height:24px}
.row.tap{cursor:pointer;border-radius:12px} .row.tap:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.asset-title{display:flex;align-items:center;justify-content:center;gap:8px} .asset-title .ai{width:24px;height:24px;display:inline-flex} .asset-title .ai img,.asset-title .ai svg{width:24px;height:24px;border-radius:50%}
.bal-sub.mono{font-family:var(--mono);font-size:13.5px;color:var(--ink-3);margin-top:4px}
.vcard{position:relative;aspect-ratio:1.586;border-radius:20px;padding:20px 22px;color:#fff;background:radial-gradient(120% 140% at 85% 0%,#1d7a61 0%,#0a5c48 38%,#063a2d 100%);display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 14px 30px rgba(6,58,45,.28);transition:filter .2s var(--ease),opacity .2s;margin-top:4px;flex-shrink:0}
.vcard.empty{width:100%;background:none;border:2px dashed var(--line);box-shadow:none}
.vcard.frozen{filter:grayscale(.85) brightness(.9);opacity:.8}
.vc-top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:600;opacity:.9} .vc-top svg{color:#fff}
.vc-num{font-size:20px;font-weight:600;letter-spacing:.06em}
.vc-bot{display:flex;justify-content:space-between;align-items:flex-end;font-size:13.5px;font-weight:600}
.vc-brand{font:italic 900 20px/1 system-ui,Arial;letter-spacing:.02em}
.vc-frozen{background:rgba(255,255,255,.92);color:#0d1512;font-weight:700;font-size:12px;padding:4px 10px;border-radius:999px}
.reveal{display:flex;align-items:center;gap:10px;justify-content:center;margin:10px 0 0;font-size:12.5px;color:var(--ink-3)} .reveal .cp{background:var(--soft)}
.spend-from{display:flex;align-items:center;gap:10px;padding:14px 0 4px;font-size:14px;color:var(--ink-2)} .spend-from .ico{width:24px;height:24px} .spend-from .ico img,.spend-from .ico svg{width:24px;height:24px;border-radius:50%}
.spend-from b{margin-left:auto;color:var(--ink);font-size:14.5px;letter-spacing:-.02em}
.strike{text-decoration:line-through;color:var(--ink-3)!important}
.profile{display:flex;align-items:center;gap:12px;padding:6px 0 16px;border-bottom:1px solid var(--line);margin-bottom:6px}
.pav{width:52px;height:52px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px;flex:none}
.pnm{flex:1;min-width:0} .pnm b{display:block;font-size:17px} .pnm span{display:block;font-size:13px;color:var(--ink-3);margin-top:2px}
.vbadge{border:0;background:#fff4e0;color:#9a5b00;font-weight:700;font-size:12px;padding:6px 10px;border-radius:999px;white-space:nowrap}
.vbadge.ok{background:var(--brand-tint);color:var(--brand)}
[data-mode="dark"] .vbadge{background:#3a2a10;color:#f5c06b}
.slist{display:flex;flex-direction:column}
.srow{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;padding:14px 0;text-align:left;font-size:16px}
.srow b{font-weight:600} .srow .chev{margin-left:auto}
.srow .sval{margin-left:auto;font-size:14px;color:var(--ink-3)} .srow .sval+.chev{margin-left:6px}
.sic{width:26px;display:grid;place-items:center;color:var(--ink)}
.sfoot{display:flex;align-items:center;justify-content:space-between;margin-top:6px;border-top:1px solid var(--line);padding-top:4px}
.srow.out{width:auto;color:#d0353a} .srow.out .sic{color:#d0353a}
.ver{font-size:12px;color:var(--ink-3);background:var(--soft);padding:5px 10px;border-radius:999px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -22px 8px;padding:0 22px 4px;scrollbar-width:none} .chips::-webkit-scrollbar{display:none}
.chipf{flex:none;display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--line);background:none;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.chipf .chev{width:14px;height:14px}
.chipf.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.sec-head{display:flex;align-items:center;justify-content:space-between} .sec-head h2{margin:0 0 6px}
.see{border:0;background:none;color:var(--brand);font-weight:650;font-size:14px;padding:4px 0}
.row.tx{width:100%;border:0;background:none;text-align:left}
.st{display:inline-block;margin-top:10px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.st.ok{background:var(--brand-tint);color:var(--brand)} .st.warn{background:#fff4e0;color:#9a5b00} .st.bad{background:#fde8e8;color:#c0272d}
.hero .big.pos{color:var(--pos)}
.ghostbtn{margin-top:14px;width:100%;height:50px;border-radius:14px;border:1.5px solid var(--line);background:none;font-weight:650;font-size:15px}
.gate-ic{width:72px;height:72px;border-radius:50%;background:var(--brand-tint);color:var(--brand);display:grid;place-items:center} .gate-ic svg{width:30px;height:30px}
.steps3{display:flex;flex-direction:column;gap:12px;margin-top:24px;width:100%;text-align:left}
.st3{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:600;color:var(--ink-3)}
.st3 span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;border:1.5px solid var(--line);flex:none}
.st3.done{color:var(--ink-2)} .st3.done span{background:var(--brand);border-color:var(--brand);color:#fff}
.st3.now{color:var(--ink)} .st3.now span{border-color:var(--brand);color:var(--brand)}
.check.held{background:#fff4e0;color:#9a5b00}
.held-note{font-size:13px;color:var(--ink-3);margin:8px 0 0;max-width:260px}
.sched{border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px;display:flex;flex-direction:column;gap:4px}
.sched-top{display:flex;justify-content:space-between;font-size:15.5px} .sched>span{font-size:13px;color:var(--ink-3)}
.sched-acts{display:flex;gap:8px;margin-top:8px} .chipf.danger{color:#d0353a}
.savebox{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;margin-top:10px;border-radius:16px;border:1.5px solid var(--line);font-size:14.5px;font-weight:600}
.switch{width:44px;height:26px;border-radius:999px;border:0;background:#cfd6d2;position:relative;padding:0;transition:background .15s var(--ease)}
.switch i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s var(--ease)}
.switch.on{background:var(--brand)} .switch.on i{transform:translateX(18px)}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:18px 0 22px}
.hero .big{font-family:var(--mono);font-weight:700;font-size:40px;letter-spacing:-.04em}
.hero .big .cc{font-size:.58em;font-weight:600;color:var(--ink-3);margin-left:.32em}
.hero .to{margin-top:6px;font-size:14.5px;color:var(--ink-2)}
.hero .to b{color:var(--ink)}
.check{width:72px;height:72px;border-radius:50%;background:var(--brand-tint);color:var(--brand);display:grid;place-items:center;margin-bottom:16px}
.check{animation:grow .22s var(--ease) both}
.check svg path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .36s .16s var(--ease) forwards}
@keyframes grow{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.hero.done .big{animation:rise .22s .34s var(--ease) both} .hero.done .to{animation:rise .22s .42s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.act .c svg{transition:transform .18s var(--ease)}
.act[data-act="add"]:hover .c svg,.act[data-act="add"]:focus-visible .c svg{transform:rotate(90deg)}
.act[data-act="send"]:hover .c svg,.act[data-act="send"]:focus-visible .c svg{transform:translateY(-3px)}
.act[data-act="convert"] .c svg path{transition:transform .18s var(--ease)}
.act[data-act="convert"]:hover .c svg,.act[data-act="convert"]:focus-visible .c svg{transform:scaleX(-1)}
.act:active .c svg{transition-duration:.1s}
@keyframes draw{to{stroke-dashoffset:0}}
.qr-box{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px}
.qr{position:relative;width:212px;height:212px}
.qr svg.code{width:212px;height:212px;display:block}
.qr .mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:14px;background:var(--brand-deep);display:grid;place-items:center;box-shadow:0 0 0 6px var(--surface)}
.qr .mid svg{width:26px;height:auto}
.qr .mid.coin{background:var(--surface);width:56px;height:56px;border-radius:50%} .qr .mid.coin>img,.qr .mid.coin>svg{width:48px;height:48px;border-radius:50%}
.qr .mid .net{position:absolute;right:-6px;bottom:-6px;width:22px;height:22px;border-radius:50%;box-shadow:0 0 0 3px var(--surface)}
.qr .mid .net img{width:100%;height:100%;border-radius:50%}
[data-mode="dark"] .qr svg.code rect{fill:#f1f5f3}
.addr-row{display:flex;align-items:flex-start;gap:10px;margin-top:20px;width:100%}
.addr-row .addr{flex:1}
.copy{width:40px;height:40px;border-radius:12px;border:0;background:var(--soft);display:grid;place-items:center;flex:none;color:var(--ink-2)}
.warn{display:flex;gap:8px;align-items:center;margin-top:16px;font-size:13px;font-weight:600;color:var(--warn)}
.tico.sv{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--ink-2)} .tico.sv svg{width:20px;height:20px;border-radius:0}
.mine .row{padding:13px 0} .mine .row+.row{border-top:1px solid var(--line)}
.mine .ico .tico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--ink-2)}
.mine .ico .tico svg{width:20px;height:20px;border-radius:0}
.list-sheet{max-height:70%;overflow:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:440px){.stage{padding:64px 0 0}.panel{width:100%;height:calc(100vh - 64px);border-radius:var(--r-panel) var(--r-panel) 0 0}}
</style>
</head>

function qrSvg(s){ let h=2166136261; for(const ch of s){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619)>>>0; } const n=29, cells=[];
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){ const inF=(fx,fy)=>x>=fx&&x<fx+7&&y>=fy&&y<fy+7; let on;
    if(inF(0,0)||inF(n-7,0)||inF(0,n-7)){ const fx=x<7?0:n-7, fy=y<7?0:n-7, dx=x-fx, dy=y-fy; on = dx===0||dx===6||dy===0||dy===6||(dx>1&&dx<5&&dy>1&&dy<5); }
    else if(x>=10&&x<=18&&y>=10&&y<=18) on=false;
    else { h^=h<<13; h>>>=0; h^=h>>>17; h^=h<<5; h>>>=0; on=(h&3)===0||(h&5)===1; }
    if(on) cells.push(`<rect x="${x}" y="${y}" width="1" height="1" rx=".35"/>`); }
  return `<svg class="code" viewBox="-1 -1 ${n+2} ${n+2}" fill="#0d1512" aria-hidden="true">${cells.join('')}</svg>`; }

      if(code==='USD'){ overlay='add'; render(); return; }
      flow={ cur:code, from:'asset', backCode:code }; view='transfer'; render(); return; }
    if(act==='send'){ window._prefSrc={ code, net: a.kind==='coin' ? (a.nets.find(x=>x.amt>0)||{}).net : undefined }; overlay='send'; render(); return; }
    if(act==='convert'){ const s=(view='convert', sources()); const i=s.findIndex(x=>x.code===code && (a.kind==='cash' || x.amt>0)); flow={ from: i>=0 ? i : 0, backCode:code }; render(); } });

function applySend(s, total){ const isNew = ['bank','card','external','centrylink'].includes(flow.kind) && !flow.recipient.saved && !flow.recipient.paidBefore; flow.held = isNew && total*RATE[s.code] >= 50000;
  if(['bank','card','external'].includes(flow.kind) && !flow.recipient.saved && flow.save!==false){ const r=flow.recipient; SAVED[flow.kind].unshift(Object.assign({}, r, flow.kind==='external' ? { asset:flow.asset, net:flow.net } : {})); r.saved=true; } const d=data(); const a=d.assets.find(x=>x.code===s.code); if(!a) return; if(a.kind==='cash') a.amt-=total; else { const n=a.nets.find(x=>x.net===s.net); if(n) n.amt-=total; }

  d.tx[0].items.unshift(item);
  if(flow.held) setTimeout(()=>{ item.pending=false; toast(`Check complete: money is on its way to ${who}`); if(view==='home'||view==='activity') render(); }, 6000);
  if(flow.repeat && flow.repeat!=='never'){ SCHEDULED.unshift({ to:who, amt:flow.amount, cur:s.code, net:s.net, every:flow.repeat, next:nextDate(flow.repeat) }); } }
