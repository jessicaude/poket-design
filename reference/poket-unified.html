function formatGrouped(digits, groups){
  const out=[]; let i=0;
  for(const g of groups){ if(i>=digits.length) break; out.push(digits.slice(i,i+g)); i+=g; }
  return out.join(' ');
}
function attachGroupFormatter(input, groups, maxDigits){
  if(!input || input.dataset.formatted) return;
  input.dataset.formatted='1';
  input.addEventListener('input', ()=>{
    const digits = input.value.replace(/\D/g,'').slice(0,maxDigits);
    input.value = formatGrouped(digits, groups);
  });
}
function attachExpiryFormatter(input){
  if(!input || input.dataset.formatted) return;
  input.dataset.formatted='1';
  input.addEventListener('input', ()=>{
    const digits = input.value.replace(/\D/g,'').slice(0,6);
    input.value = digits.length>2 ? digits.slice(0,2)+' / '+digits.slice(2) : digits;
  });
}
function attachDateFormatter(input){
  if(!input || input.dataset.formatted) return;
  input.dataset.formatted='1';
  input.addEventListener('input', ()=>{
    const digits = input.value.replace(/\D/g,'').slice(0,8);
    let out = digits;
    if(digits.length>2) out = digits.slice(0,2)+' / '+digits.slice(2);
    if(digits.length>4) out = digits.slice(0,2)+' / '+digits.slice(2,4)+' / '+digits.slice(4);
    input.value = out;
  });
}
function isExpiryValid(value){
  const m = /^(0[1-9]|1[0-2]) \/ (\d{4})$/.exec(value);
  if(!m) return false;
  const month = parseInt(m[1],10);
  const year = parseInt(m[2],10);
  const now = new Date();
  const currentYear = now.getFullYear();
  const currentMonth = now.getMonth()+1;
  if(year < currentYear) return false;
  if(year === currentYear && month < currentMonth) return false;
  return true;
}
function wireCardFormValidation(){
  const num=document.getElementById('cardNumInput');
  const exp=document.getElementById('cardExpInput');
  const cvc=document.getElementById('cardCvcInput');
  const zip=document.getElementById('cardZipInput');
  if(!num || !exp || !cvc) return;
  const btn=document.getElementById('saveNewCard')||document.getElementById('obPay');
  const brandIcon=document.getElementById('cardBrandIcon');
  const updateBrandIcon=()=>{
    if(!brandIcon) return;
    const digits = num.value.replace(/\D/g,'');
    let badge = '';
    if(digits.length>=2){
      if(digits[0]==='4') badge = cardBadge('visa');
      else if(/^5[1-5]/.test(digits)) badge = cardBadge('mastercard');
    }
    if(badge){ brandIcon.innerHTML=badge; brandIcon.style.display='flex'; }
    else { brandIcon.innerHTML=''; brandIcon.style.display='none'; }
  };
  const check=(showInvalid)=>{
    const numOk = num.value.replace(/\D/g,'').length===16;
    const expOk = isExpiryValid(exp.value);
    const cvcOk = /^\d{3}$/.test(cvc.value);
    const zipOk = zip ? /^\d{5}$/.test(zip.value) : true;
    const expHint = document.getElementById('expHint');
    if(expHint){
      const formatOk = /^(0[1-9]|1[0-2]) \/ \d{2}$/.test(exp.value);
      const showExpired = showInvalid.has(exp) && formatOk && !expOk;
      expHint.style.display = showExpired ? 'block' : 'none';
    }
    [[num,numOk],[exp,expOk],[cvc,cvcOk]].concat(zip?[[zip,zipOk]]:[]).forEach(([el,ok])=>{
      const touched = el.value.length>0;
      el.classList.toggle('is-valid', ok && touched);
      el.classList.toggle('is-invalid', showInvalid.has(el) && touched && !ok);
    });
    if(btn) btn.disabled = !(numOk && expOk && cvcOk && zipOk);
    updateBrandIcon();
  };
  const blurred = new Set();
  [num,exp,cvc].concat(zip?[zip]:[]).forEach(el=>{
    el.addEventListener('input', ()=>check(blurred));
    el.addEventListener('blur', ()=>{ blurred.add(el); check(blurred); });
  });
  check(blurred);
}

function kycIncentiveCopy(fragCount){
  if(S.kycIncentive==='feefree1'){
    const n = fragCount;
    return n>1 ? `Your next ${n} top-ups are fee-free.` : 'Your next top-up is fee-free.';

  const pts = fragCount*150;
  return `+${pts} points added to your Poket rewards.`;
}

function tKycFragGate(){
  const queue = fragmentsNeededForAmount(S.pendingTopupAmt||0);
  const target = Math.min(S.balance+(S.pendingTopupAmt||0), PROGRESSIVE_LIMITS[PROGRESSIVE_LIMITS.length-1]);
  const finalLimit = PROGRESSIVE_LIMITS[Math.min(progressiveFragmentsDone()+queue.length, PROGRESSIVE_LIMITS.length-1)];
  return `
  <button class="back-row" data-back="addMoney"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M8 2.5 4.5 6 8 9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg> Back</button>

function switchToMethod(id){
  if(id==='card'){ S.addKind='debit'; S.wScreen='addCard'; renderWidget(); return; }
  if(id==='bank'){ S.bankPick=null; S.bankManual=false; S.wScreen='linkBank'; renderWidget(); return; }
  S.defaultMethod = methodById(id);
  const short = S.balance < ORDER;
  if(short && (S.addMethodReturn==='checkout' || S.addMethodReturn==='element')){
    S.addMethodReturn=null;
    const gap=ORDER-S.balance;
    const m=S.defaultMethod;
    const fee=computeFee(gap, m&&m.credit);
    S.liveConnect = {id:m.id, label:m.label, amt:gap, _m:m, _gap:gap, _fee:fee};
    S.wScreen='liveConnect'; renderWidget();
    return;
  }
  if(S.addMethodReturn==='element'){ S.addMethodReturn=null; closeWidget(); renderElement(); return; }
  if(S.addMethodReturn==='wallet'){ S.addMethodReturn=null; S.wScreen='tabs'; S.tab='wallet'; renderWidget(); renderElement(); return; }
  closeWidget(); renderElement();
}

/*
 * APPLE PAY / GOOGLE PAY, linking
 * ---------------------------------------------------------------
 * Both are tokenization layers over a card the shopper already has
 * in their device wallet, not a balance of their own. Linking:
 *   1. Shopper taps Apple Pay / Google Pay in the method chooser.
 *   2. The device/account sheet confirms which underlying card will
 *      back it (shown here as "Visa ····8812 behind it" / the
 *      Google account); the shopper doesn't type card details.
 *   3. Device auth: Face ID/Touch ID for Apple Pay, the signed-in
 *      Google account for Google Pay.
 *   4. The "Allow charging" grant is asked explicitly and is OFF by
 *      default risk-wise; this is the merchant-token consent from
 *      doc v2 6.1. Without it, the method links but can only be
 *      used with a fresh per-transaction confirmation, never
 *      silently (see PAYING below). With it granted, the method
 *      becomes eligible for auto top-up and can be set default.
 *
 * CASH APP, linking
 * ---------------------------------------------------------------
 * Cash App is a real balance the shopper holds elsewhere (Block),
 * not a card proxy, so linking is an approval loop rather than a
 * device confirm:
 *   1. Shopper taps Cash App in the method chooser.
 *   2. Poket shows a QR (desktop) or would deep-link straight
 *      into the Cash App (mobile); nothing is shared yet.
 *   3. The shopper approves the link request inside Cash App itself.
 *      Poket is waiting/polling during this step (hence the
 *      longer "Waiting for approval" busy state vs. the near-instant
 *      device flows above).
 *   4. Same "Allow charging" grant as Apple/Google Pay, same
 *      consequence: without it, Cash App can only confirm one
 *      payment at a time, never auto-charge.
 *
 * PAYING with Apple Pay / Google Pay / Cash App at checkout
 * ---------------------------------------------------------------
 * There are two distinct "paying with X" situations, and they
 * behave differently on purpose:
 *
 *  (a) Covering a balance shortfall (auto top-up or manual top-up).
 *      If the method carries the charging grant AND is the default
 *      (or chosen via the session "Change" picker), the shortfall is
 *      charged to it silently, same as a card, no extra prompt,
 *      because the grant already stands in for per-transaction
 *      consent. This is what `executePay()`'s auto-top-up branch and
 *      `confirmLow`'s manual branch do today via `methodById()`.
 *      If the method does NOT carry the grant, it is excluded from
 *      both the default-method slot and the session picker entirely
 *      (see the `cand` filter in `tMethodPick`); it literally isn't
 *      offered as a silent option.
 *
 *  (b) Paying the *entire* order with Apple Pay / Google Pay / Cash
 *      App instead of the wallet balance (bypassing Poket's
 *      balance-first economics). This is NOT built in the current
 *      prototype; every payment here is still balance-first,
 *      shortfall-only. A true "pay entirely with Apple Pay" button
 *      would be a different feature (skipping the wallet ledger for
 *      that transaction) and is logged as an open question in the
 *      doc, not a bug in this build.
 */
function tLinkApple(){ return `
  <button class="back-row" data-back="addMethodPick"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M8 2.5 4.5 6 8 9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg> Back</button>

  <p class="step-sub">Confirms with Face ID on this device. Your card stays inside Apple Pay.</p>
  <div class="method-row">${APPLE_BADGE}<span class="grow">Apple Pay<small>This device · Visa ····8812 behind it</small></span></div>
  ${grantRow(S.linkGrant)}
  <button class="btn-primary" id="linkGo" data-rail="apple">Confirm with Face ID</button>`;
}

/*

 * ---------------------------------------------------------------
 * 1. Shopper picks "Pay by Bank" from the method chooser.
 * 2. Bank picker: shopper selects their bank from a list (in
 *    production this is typically an open-banking aggregator's
 *    institution search, e.g. Plaid/Mono/Stitch, not a fixed list).
 * 3. Shopper is handed off to the bank's own login (their real
 *    banking credentials are never seen or stored by Poket;
 *    the aggregator brokers a token-scoped connection).
 * 4. On return, Poket shows an explicit consent screen naming
 *    exactly three things before the account is linked:
 *      - what is authorized ("top-ups you approve")

 *    Methods as a funding source, last 4 of the account number only.

 *    a bank-linked account can only pre-fund the wallet (Add money)

  const summary = `

    ${pct?`<div class="pay-row"><span class="k">Card fee 3%</span><span class="v">${fmt(pct)}</span></div>`:''}
    ${!isLive && !S.merchantPaysFee?`<div class="pay-row"><span class="k">Top-up fee</span><span class="v">${fmt(5)}</span></div>`:''}

/* =================== widget wiring =================== */
function wireWidget(){
  const $ = id => document.getElementById(id);

  document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{
    S.tab=b.dataset.tab; renderWidget();
  }));
  document.querySelectorAll('[data-asub]').forEach(b=>b.addEventListener('click',()=>{ S.activitySub=b.dataset.asub; renderWidget(); }));
  document.querySelectorAll('[data-back]').forEach(b=>b.addEventListener('click',()=>{
    S.wScreen=b.dataset.back;
    if(b.dataset.backtab) S.tab=b.dataset.backtab;
    renderWidget();
  }));
  document.querySelectorAll('[data-switchmethod]').forEach(b=>b.addEventListener('click',()=>{ switchToMethod(b.dataset.switchmethod); }));
  $('msMore')?.addEventListener('click', e=>{
    e.stopPropagation();
    const dd = document.getElementById('msDropdown');
    const open = dd.classList.toggle('open');
    e.currentTarget.setAttribute('aria-expanded', open);
  });

  /* settings */
  if(S.wScreen==='settings'){
    $('setFirstName')?.addEventListener('change',e=>{ S.firstName=e.target.value.trim()||S.firstName; });
    $('setLastName')?.addEventListener('change',e=>{ S.lastName=e.target.value.trim()||S.lastName; });
    $('addPhone')?.addEventListener('click',()=>{
      const v=$('phoneInput').value.trim();
      const code=$('phoneCode').value;
      if(v){ S.phone=code+' '+v; renderWidget(); }
    });
    $('removePhone')?.addEventListener('click',()=>{ S.phone=null; if(S.channel==='text')S.channel='email'; renderWidget(); });
    document.querySelectorAll('[data-channel]').forEach(b=>b.addEventListener('click',()=>{
      if(b.dataset.channel==='text'&&!S.phone)return;
      S.channel=b.dataset.channel; renderWidget();
    }));
    document.querySelectorAll('[data-revoke]').forEach(b=>b.addEventListener('click',()=>{
      S.devices=S.devices.filter(d=>d.id!==b.dataset.revoke); renderWidget();
    }));
    $('resetPinBtn')?.addEventListener('click', startPinReset);
  }

  /* error screens (available from any screen) */
  $('lockedClose')?.addEventListener('click',closeWidget);
  if(S.wScreen==='launcherIntro'){
    const inp=$('lsEmailInput'), next=$('lsEmailNext'), otpSection=$('lsOtpSection'), sentTo=$('lsOtpSentTo');
    let otpDone = false;
    const emailValid = () => /^\S+@\S+\.\S+$/.test(inp.value);
    const updateNext = () => { next.disabled = !(emailValid() && otpDone); };
    const revealOtp = ()=>{
      if(!emailValid()) return;
      const wasHidden = otpSection.style.display==='none';
      otpSection.style.display='block';
      sentTo.textContent = `We sent a code to ${inp.value.trim()}.`;
      if(wasHidden) setTimeout(()=>document.querySelector('.otp-box')?.focus(),50);
      updateNext();
    };
    inp.addEventListener('blur', revealOtp);
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); revealOtp(); } });
    inp.addEventListener('input', ()=>{
      if(!emailValid()){ otpSection.style.display='none'; otpDone=false; }
      updateNext();
    });
    wireOtp(()=>{ otpDone = true; updateNext(); });
    next.addEventListener('click', ()=>{
      if(next.disabled) return;
      S.email = inp.value.trim();
      S.trusted=true;
      activateEmptyAccount();
      S.launcherSeen = true;
      S.tab = 'wallet';
      S.wScreen='tabs'; renderWidget(); renderLauncher();
    });
  }
  if(S.wScreen==='launcherSignIn'){
    wireOtp(()=>{
      S.trusted=true;
      const unread = !S.launcherSeen;
      S.launcherSeen = true;
      S.tab = unread ? 'activity' : 'wallet';
      S.wScreen='tabs'; renderWidget(); renderLauncher();
    });
  }
  $('pinLockedReset')?.addEventListener('click', startPinReset);
  $('pinLockedClose')?.addEventListener('click',()=>{ S.wScreen='tabs'; S.tab='wallet'; renderWidget(); });
  $('kycRetry')?.addEventListener('click',()=>{ S.wScreen='kyc'; renderWidget(); });
  if(S.wScreen==='errScreen'){
    $('errRetry')?.addEventListener('click',()=>{ S.err.retryFn(); });
    $('errAlt')?.addEventListener('click',()=>{ S.err.altFn && S.err.altFn(); });
    $('errCancel')?.addEventListener('click',closeWidget);
  }

  /* wallet tab */
  $('goAddMoney')?.addEventListener('click',()=>{
    S.pfAmt=null;
    S.pfDest = (S.cards && S.cards[0]) ? 'card-'+S.cards[0].id : (S.bank && !S.bank.pending ? 'bank' : null);
    S.wScreen='addMoney'; renderWidget();
  });
  $('goWithdraw')?.addEventListener('click',()=>{
    if(S.kycEnabled && S.kyc!=='tier2'){ S.wScreen='kycGate'; renderWidget(); return; }
    S.wdAmt=null;
    S.wdDest = (S.bank && !S.bank.pending) ? 'bank' : (S.cards && S.cards[0] ? 'card-'+S.cards[0].id : null);
    S.wScreen='withdraw'; renderWidget();
  });
  $('gateVerify')?.addEventListener('click',()=>{ S.wScreen='kyc'; renderWidget(); });
  $('wdAddMethod')?.addEventListener('click',()=>{
    S.addMethodReturn='withdraw'; S.wScreen='addMethodPick'; renderWidget();
  });
  $('pfAddMethod')?.addEventListener('click',()=>{
    S.addMethodReturn='addmoney'; S.wScreen='addMethodPick'; renderWidget();
  });
  $('walletEyeBtn')?.addEventListener('click',()=>{ S.masked=!S.masked; renderWidget(); });
  $('balMethodBtn')?.addEventListener('click',()=>{
    S.pickMode='default';
    S.pickReturn='wallet';
    const cur = S.defaultMethod;
    S.pickSel = cur ? cur.id : null;
    S.wScreen='methodPick'; renderWidget();
  });
  document.querySelectorAll('[data-notif]').forEach(b=>b.addEventListener('click',()=>{ goToNotification(b.dataset.notif); }));
  $('notifViewAll')?.addEventListener('click',()=>{ S.wScreen='notifications'; renderWidget(); });

  /* add money */
  if(S.wScreen==='addMoney'){
    document.querySelectorAll('[data-amt]').forEach(b=>b.addEventListener('click',()=>{ S.pfAmt=+b.dataset.amt; renderWidget(); }));
    document.querySelectorAll('[data-dest]').forEach(b=>b.addEventListener('click',()=>{ S.pfDest=b.dataset.dest; renderWidget(); }));
    $('amtInput').addEventListener('input',e=>{ S.pfAmt=Math.round(parseFloat(e.target.value||'0')*100)||null; });
    $('pfGo').addEventListener('click',()=>{
      const amt=S.pfAmt;
      if(!amt||amt<=0) return;
      if(S.kycProgressive){
        const max = progressiveLimit()-S.balance;
        if(amt>max){
          if(nextProgressiveFragment()){
            S.pendingTopupAmt=amt; S.wScreen='kycFragGate'; renderWidget(); return;
          }
          alert('Maximum limit: you can add up to '+fmt(Math.max(max,0))); return;
        }
      } else {
        const max = HOLD_LIMIT[S.kyc]-S.balance;
        if(S.kycEnabled && amt>max){ alert('Tier limit: you can add up to '+fmt(Math.max(max,0))); return; }
      }
      executeAddMoney(amt);
    });
  }

  /* progressive KYC fragment flow */
  $('kycFragGateNext')?.addEventListener('click',()=>{
    S.kycFragQueue = fragmentsNeededForAmount(S.pendingTopupAmt||0);
    S.kycFragQueueIdx = 0;
    S.kycBatchRewards = 0;
    S.wScreen='kycFragAsk'; renderWidget();
  });
  if(S.wScreen==='kycFragAsk'){
    const f = S.kycFragQueue[S.kycFragQueueIdx];
    const inp = $('kycFragInput'), next = $('kycFragNext');
    if(f && f.key==='dob') attachDateFormatter(inp);
    inp?.addEventListener('input', ()=>{ next.disabled = inp.value.trim().length<2; });
    next?.addEventListener('click', ()=>{
      if(next.disabled || !f) return;
      S.kycFragments[f.key] = true;
      S.kycBatchRewards += 1;
      if(S.kycIncentive==='feefree1') S.kycFeeFreeCredits += 1;
      if(S.kycIncentive==='feefree5') S.kycFeeFreeCredits += 5;
      if(S.kycFragQueueIdx < S.kycFragQueue.length-1){
        S.kycFragQueueIdx += 1;
        renderWidget();
      } else {
        S.wScreen='kycFragDone'; renderWidget();
      }
    });
  }
  $('kycFragDoneNext')?.addEventListener('click',()=>{
    const pending = S.pendingTopupAmt;
    if(pending==null){ S.wScreen='tabs'; S.tab='wallet'; renderWidget(); return; }
    const max = progressiveLimit()-S.balance;
    if(pending>max){
      if(nextProgressiveFragment()){
        S.wScreen='kycFragGate'; renderWidget(); return;
      }
      S.pendingTopupAmt=null;
      alert('Maximum limit: you can add up to '+fmt(Math.max(max,0)));
      S.wScreen='addMoney'; renderWidget(); return;
    }
    S.pendingTopupAmt=null;
    S.pfAmt=pending;
    S.wScreen='addMoney'; renderWidget();
    executeAddMoney(pending);
  });

  /* withdraw */
  if(S.wScreen==='withdraw'){
    document.querySelectorAll('[data-amt]').forEach(b=>b.addEventListener('click',()=>{ S.wdAmt=+b.dataset.amt; renderWidget(); }));
    document.querySelectorAll('[data-dest]').forEach(b=>b.addEventListener('click',()=>{ S.wdDest=b.dataset.dest; renderWidget(); }));
    $('amtInput').addEventListener('input',e=>{ S.wdAmt=Math.round(parseFloat(e.target.value||'0')*100)||null; });
    $('wdGo').addEventListener('click',()=>{
      if(!S.wdAmt||S.wdAmt<=0) return;
      if(S.wdAmt>S.balance){ alert('Amount exceeds your available balance.'); return; }
      S.pinError=''; S.pinAttempts=0;
      S.pinStage = S.pin ? 'entry' : 'create';
      S.pinPurpose='withdraw';
      S.pinNext = 'withdraw';
      S.wScreen='pin'; renderWidget();
      setTimeout(()=>document.querySelector('.otp-box')?.focus(),100);
    });
  }

  /* pin */
  if(S.wScreen==='pin'){
    const boxes=[...document.querySelectorAll('.otp-box')];
    boxes.forEach((b,i)=>{
      b.addEventListener('input',()=>{
        b.value=b.value.replace(/\D/g,'').slice(0,1);
        if(b.value&&i<3)boxes[i+1].focus();
        if(boxes.every(x=>x.value)){
          const val=boxes.map(x=>x.value).join('');
          setTimeout(()=>pinComplete(val),180);
        }
      });
      b.addEventListener('keydown',e=>{ if(e.key==='Backspace'&&!b.value&&i>0)boxes[i-1].focus(); });
    });
  }

  if(S.wScreen==='pinResetOtp'){
    wireOtp(()=>{
      S.pinPurpose='reset'; S.pin=null; S.pinDraft=null; S.pinAttempts=0; S.pinError='';
      S.pinStage='create'; S.wScreen='pin'; renderWidget();
      setTimeout(()=>document.querySelector('.otp-box')?.focus(),100);
    });
  }

  /* done */
  $('doneToWallet')?.addEventListener('click',()=>{ S.wScreen='tabs'; S.tab='wallet'; renderWidget(); });

  /* wallet tab */
  $('startKyc')?.addEventListener('click',()=>{ S.wScreen='kyc'; renderWidget(); });
  $('submitKyc')?.addEventListener('click',()=>{
    goBusy('Reviewing your details','Usually under a day. Instant in this demo.',()=>{
      if(S.armedError && S.armedError.cat==='kyc'){
        S.armedError=null;
        S.wScreen='kycRejected'; renderWidget();
        return;
      }
      S.kyc='tier2'; S.wScreen='tabs'; S.tab='wallet'; renderWidget();
    },1500);
  });

  /* activity */
  document.querySelectorAll('[data-txn]').forEach(b=>b.addEventListener('click',()=>{
    S.selTxn=b.dataset.txn; S.wScreen='txnDetail'; renderWidget();
  }));
  $('raiseDispute')?.addEventListener('click',()=>{
    S.disputeReason=null; S.disputeContacted=null; S.disputeContactDate=''; S.disputeEvidence=false; S.disputeContactOk=null;
    S.wScreen='disputeWarn'; renderWidget();
  });
  $('disputeWarnNext')?.addEventListener('click',()=>{ S.wScreen='disputeIntro'; renderWidget(); });
  $('disputeIntroNext')?.addEventListener('click',()=>{ S.wScreen='disputeReason'; renderWidget(); });
  document.querySelectorAll('[data-reason]').forEach(b=>b.addEventListener('click',()=>{
    S.disputeReason=b.dataset.reason; renderWidget();
  }));
  $('disputeReasonNext')?.addEventListener('click',()=>{ if(S.disputeReason){ S.wScreen='disputeContactAsk'; renderWidget(); } });
  document.querySelectorAll('[data-contacted]').forEach(b=>b.addEventListener('click',()=>{
    S.disputeContacted=b.dataset.contacted; renderWidget();
  }));
  $('disputeContactAskNext')?.addEventListener('click',()=>{
    S.wScreen = S.disputeContacted==='yes' ? 'disputeContactWhen' : 'disputeEvidence';
    renderWidget();
  });
  attachDateFormatter($('disputeContactDateInput'));
  $('disputeContactDateInput')?.addEventListener('input',e=>{ S.disputeContactDate=e.target.value; });
  $('disputeContactWhenNext')?.addEventListener('click',()=>{ S.wScreen='disputeEvidence'; renderWidget(); });
  $('disputeAttachFile')?.addEventListener('click',()=>{ S.disputeEvidence=true; renderWidget(); });
  $('disputeEvidenceNext')?.addEventListener('click',()=>{ S.wScreen='disputeConfirmContact'; renderWidget(); });
  document.querySelectorAll('[data-contactok]').forEach(b=>b.addEventListener('click',()=>{
    S.disputeContactOk=b.dataset.contactok; renderWidget();
  }));
  $('submitDispute')?.addEventListener('click',()=>{
    goBusy('Submitting dispute','Sending your details for review.',()=>{
      const t=S.txns.find(x=>x.id===S.selTxn); t.dispute='open';
      S.disputeStrikes = Math.min(S.disputeStrikes+1, 2);
      S.wScreen='disputeDone'; renderWidget();
    });
  });
  $('disputeBack')?.addEventListener('click',()=>{ S.wScreen='tabs'; S.tab='activity'; renderWidget(); });

  /* methods */
  document.querySelectorAll('[data-setdefault]').forEach(b=>b.addEventListener('click',()=>{
    S.defaultMethod = methodById(b.dataset.setdefault);
    renderWidget(); renderElement();
  }));
  document.querySelectorAll('[data-subrow]').forEach(b=>b.addEventListener('click',()=>{
    S.selSub=b.dataset.subrow; S.wScreen='subDetail'; renderWidget();
  }));
  document.querySelectorAll('[data-subfilter]').forEach(b=>b.addEventListener('click',()=>{
    S.subFilter=b.dataset.subfilter; renderWidget();
  }));
  document.querySelectorAll('[data-subcancel]').forEach(b=>b.addEventListener('click',()=>{
    S.subConfirm = {id:b.dataset.subcancel, action:'cancel'}; renderWidget();
  }));
  document.querySelectorAll('[data-subconfirmyes]').forEach(b=>b.addEventListener('click',()=>{
    const {id} = S.subConfirm;
    const s=S.subs.find(x=>x.id===id);
    s.status='cancelled';
    s.endDate=Date.now();
    s.nextDate=null;
    S.subConfirm=null; renderWidget();
  }));
  document.querySelectorAll('[data-subconfirmno]').forEach(b=>b.addEventListener('click',()=>{
    S.subConfirm=null; renderWidget();
  }));
  document.querySelectorAll('[data-removecard]').forEach(b=>b.addEventListener('click',()=>{
    const id=b.dataset.removecard;
    S.cards=S.cards.filter(c=>c.id!==id);
    if(S.defaultMethod&&S.defaultMethod.id===id){
      S.defaultMethod = S.cards[0]?methodById(S.cards[0].id):(S.bank?methodById('bank'):null);
    }
    renderWidget(); renderElement();
  }));
  document.querySelector('[data-removebank]')?.addEventListener('click',()=>{
    S.bank=null;
    if(S.defaultMethod&&S.defaultMethod.id==='bank'){
      S.defaultMethod = S.cards[0]?methodById(S.cards[0].id):null;
    }
    renderWidget();
  });
  document.querySelectorAll('[data-togglepay]').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.togglepay;
    S[k]=!S[k];
    const grants={applePay:'appleGrant',googlePay:'googleGrant',cashApp:'cashGrant'};
    if(!S[k]) S[grants[k]]=false;
    const idmap={applePay:'apple',googlePay:'google',cashApp:'cashapp'};
    if(!S[k] && S.defaultMethod && S.defaultMethod.id===idmap[k]){

function pinComplete(val){
  if(S.pinStage==='create'){
    S.pinDraft=val; S.pinStage='confirm'; S.pinError=''; renderWidget();
    setTimeout(()=>document.querySelector('.otp-box')?.focus(),100);
  } else if(S.pinStage==='confirm'){
    if(val===S.pinDraft){
      S.pin=val;
      if(S.pinPurpose==='reset'){
        S.doneTitle='PIN updated';
        S.doneSub='Your new PIN is set. Use it next time you withdraw.';
        S.wScreen='moneyDone'; renderWidget();
      } else {
        executeWithdraw();
      }
    }
    else { S.pinStage='create'; S.pinDraft=null; S.pinError='PINs did not match. Start over.'; renderWidget();
      setTimeout(()=>document.querySelector('.otp-box')?.focus(),100); }
  } else { // entry
    if(S.armedError && S.armedError.cat==='pin'){
      S.pinAttempts=(S.pinAttempts||0)+1;
      if(S.pinAttempts>=3){
        S.armedError=null;
        S.wScreen='pinLocked'; renderWidget();
        return;
      }
      const left=3-S.pinAttempts;
      S.pinError=`Incorrect PIN. ${left} attempt${left===1?'':'s'} left.`;
      renderWidget();
      setTimeout(()=>document.querySelector('.otp-box')?.focus(),50);
      return;
    }
    S.pinAttempts=0;
    executeWithdraw();
  }
}

function executeWithdraw(){
  const amt=S.wdAmt, bank=S.wdDest==='bank';
  const card = !bank ? S.cards.find(c=>'card-'+c.id===S.wdDest) : null;
  const fee = bank?0:Math.max(Math.round(amt*0.015),25);
  const destLabel = bank?`${S.bank.name} ····${S.bank.last4}`:`${card.brand} ····${card.last4}`;
  goBusy('Sending withdrawal', bank?'Starting the bank transfer.':'Pushing to your debit card.', ()=>{
    if(!bank && S.armedError && S.armedError.cat==='card'){
      S.armedError=null;
      showError('Payout declined', "Your card can't accept instant payouts right now. Your balance was not affected.", ()=>{ S.wScreen='withdraw'; renderWidget(); }, S.bank ? {
        altLabel:'Send to bank instead', altFn:()=>{ S.wdDest='bank'; S.wScreen='withdraw'; renderWidget(); }
      } : undefined);
      return;
    }
    if(bank && S.armedError && S.armedError.cat==='bank'){
      S.armedError=null;
      showError('Transfer failed', "Your bank rejected this transfer. Your balance was not affected.", ()=>{ S.wScreen='withdraw'; renderWidget(); });
      return;
    }
    S.balance-=amt;
    addTxn({name:'Withdrawal · '+destLabel, amt:-amt, type:'withdrawal'});
    S.doneTitle='Withdrawal on its way';
    S.doneSub=fmt(amt-fee)+' to '+destLabel+(fee?' after a '+fmt(fee)+' fee':'')+(bank?'. Arrives in 1-2 business days.':'. Arrives in minutes.');
    S.wScreen='moneyDone'; renderWidget();
  });
}

function wireOtp(done){
  const boxes=[...document.querySelectorAll('.otp-box')];
  boxes.forEach((b,i)=>{
    b.addEventListener('input',()=>{
      b.value=b.value.replace(/\D/g,'').slice(0,1);
      if(b.value&&i<5)boxes[i+1].focus();
      if(boxes.every(x=>x.value)){
        setTimeout(()=>{
          if(S.armedError && S.armedError.cat==='passcode'){
            S.otpAttempts++;
            if(S.otpAttempts>=5){
              S.armedError=null;
              S.wScreen='passcodeLocked'; renderWidget();
            } else {
              const left=5-S.otpAttempts;
              S.otpError=`Incorrect passcode. ${left} attempt${left===1?'':'s'} left.`;
              renderWidget();
              setTimeout(()=>document.querySelector('.otp-box')?.focus(),50);
            }
          } else {
            S.otpError=''; S.otpAttempts=0;
            done();
          }
        },220);
      }
    });
    b.addEventListener('keydown',e=>{ if(e.key==='Backspace'&&!b.value&&i>0)boxes[i-1].focus(); });
  });
  document.getElementById('resend')?.addEventListener('click',e=>{ e.target.textContent='Sent ✓'; });
}

function finishOnboard(method){
  const numDigits = (method==='debit'||method==='credit') ? (document.getElementById('cardNumInput')?.value||'').replace(/\D/g,'') : '';
  S.wScreen='obPaying'; renderWidget();
  setTimeout(()=>{
    if((method==='debit'||method==='credit') && S.armedError && S.armedError.cat==='card'){
      const [title,msg]=CARD_ERR_COPY[S.armedError.mode];
      S.armedError=null;
      showError(title, msg, ()=>{ S.wScreen='obCard'; renderWidget(); }, {
        altLabel:'Choose a different way to pay',
        altFn:()=>{ closeWidget(); }
      });
      return;
    }
    S.hasWallet=true; S.trusted=true;
    const isCardMethod = method==='debit'||method==='credit';
    const detBrand = numDigits ? detectCardBrand(numDigits) : (method==='credit'?'Mastercard':'Visa');
    const detLast4 = numDigits.slice(-4) || (method==='credit'?'9010':'4242');
    const M = {
      debit:  {label:`${detBrand} ····${detLast4}`, cc:detBrand==='Mastercard'?'MC':'VISA', pill:`····${detLast4}`, kind:'Debit'},
      credit: {label:`${detBrand} ····${detLast4}`, cc:detBrand==='Mastercard'?'MC':'VISA', pill:`····${detLast4}`, kind:'Credit'},
      bank:   {label:`${S.obBankPick||'Chase'} ····0231`, cc:'BANK',  pill:'····0231'},
      apple:  {label:'Apple Pay',           cc:'PAY',  pill:'Apple Pay'},
      google: {label:'Google Pay',          cc:'G',     pill:'G Pay'},
      cashapp:{label:'Cash App · $ada',       cc:'$',     pill:'$ada'},
    }[method];
    if(isCardMethod){ S.cards=[{id:'c1',brand:detBrand,last4:detLast4,isDefault:true,credit:method==='credit'}]; }
    if(method==='bank'){ S.bank={name:S.obBankPick||'Chase',last4:'0231'}; }
    S.lastMethod={cc:M.cc, label:M.pill, kind:M.kind};
    S.defaultMethod = {id:method==='debit'||method==='credit'?'c1':method, cc:M.cc, label:M.label, pill:M.pill, credit:method==='credit', kind:M.kind};
    S.obFee = computeFee(ORDER, method==='credit');
    S.paidFee = S.obFee;
    addTxn({name:'Top-up · '+M.label, amt:ORDER, type:'funding'});
    S.balance=ORDER;
    if(POKET.checkoutOnly()){
      S.balance-=ORDER;
      addTxn({name:'Ilé Living', amt:-ORDER, type:'debit'});
      S.paid=true; S.paidSplit=null; markProvisionalUsed();
      S.wScreen='obDone'; renderWidget(); renderElement();
      return;
    }
    S.obFunded = { label:M.label, fee:S.obFee };
    S.wScreen='obFunded'; renderWidget(); renderElement();
  },1400);
}

function computeFee(amount, isCredit){
  if(S.merchantPaysFee) return 0;
  return (isCredit ? Math.round(amount*0.03) : 0) + 5;
}
function prospectiveFee(){
  if(S.paid) return S.paidFee||0;
  if(!S.hasWallet) return computeFee(ORDER, S.onboardMethod==='credit');
  if(S.balance>=ORDER) return 0;
  const m=resolveMethod();
  return computeFee(ORDER-S.balance, m&&m.credit);
}

function armLauncherPeekTimer(){
  clearTimeout(S.launcherTimer);
  if(S.launcherState!=='peek') return;
  const unread = S.hasWallet && !S.launcherSeen;
  if(unread) return; // never collapse while there's something unseen
  S.launcherTimer = setTimeout(()=>{ S.launcherState='idle'; renderLauncher(); armLauncherShrinkTimer(); }, 3500);
}
function armLauncherShrinkTimer(){
  clearTimeout(S.launcherTimer);
  if(S.launcherState!=='idle') return;
  const unread = S.hasWallet && !S.launcherSeen;
  if(unread) return; // never shrink while there's something unseen
  S.launcherTimer = setTimeout(()=>{ S.launcherShrunk=true; renderLauncher(); }, 3000);
}

function renderLauncher(){
  const inner = document.getElementById('launcherInner');
  const badge = document.getElementById('launcherBadge');
  if(!inner) return;
  const unread = S.hasWallet && !S.launcherSeen;
  badge.style.display = unread ? 'block' : 'none';

  if(S.launcherState==='peek' && S.hasWallet){
    inner.innerHTML = `
      <div class="launcher-pill" id="launcherPill">
        <div class="lp-top">
          ${MARK}
          <span class="lp-bal" id="lpBal">${S.masked?'$ ••••':fmt(S.balance)}</span>
          <span class="eye" id="lpEye" role="button" aria-label="Show balance" style="width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center">
            ${eyeIcon(S.masked)}
          </span>
        </div>
        <div class="lp-email">${S.email||''}</div>
      </div>`;
    document.getElementById('launcherPill').addEventListener('click', e=>{
      e.stopPropagation();
      if(e.target.closest('#lpEye')) return;
      launcherOpen();
    });
    document.getElementById('lpEye').addEventListener('click', e=>{ e.stopPropagation(); S.masked=!S.masked; renderLauncher(); });
  } else if(S.launcherState==='peek' && !S.hasWallet){
    inner.innerHTML = `<div class="launcher-label-pill" id="launcherPill">${MARK}<span>Wallet</span></div>`;
    document.getElementById('launcherPill').addEventListener('click', e=>{ e.stopPropagation(); launcherOpen(); });
  } else {
    inner.innerHTML = `<div class="launcher-circle ${S.launcherShrunk?'shrunk':''}" id="launcherCircle">${MARK}</div>`;
    document.getElementById('launcherCircle').addEventListener('click', (e)=>{
      e.stopPropagation();
      S.launcherShrunk=false;
      S.launcherState='peek'; renderLauncher(); armLauncherPeekTimer();
    });
  }
}

/* ---------- deep-linking: read scenario state from the URL on load ---------- */
function applyUrlParams(){
  const p = new URLSearchParams(location.search);
  const activate = (attr, value) => {
    document.querySelectorAll(`.rail-btn[data-${attr}]`).forEach(x=>x.classList.remove('active'));
    const btn = document.querySelector(`.rail-btn[data-${attr}="${value}"]`);
    if(btn) btn.classList.add('active');
    return btn;
  };

  const scenario = p.get('scenario');
  if(scenario && SCEN[scenario]){
    resetScenario(scenario);
    const btn = activate('scenario', scenario);
    
  }

  const kyc = p.get('kyc');
  if(kyc==='on' || kyc==='off'){
    S.kycEnabled = kyc==='on';
    activate('kyc', kyc);
  }

  const cashapp = p.get('cashapp');
  if(cashapp==='installed' || cashapp==='notinstalled'){
    S.livePayInstalled = cashapp==='installed';
    activate('cashapp', cashapp);
  }

  const variant = p.get('variant');
  if(variant==='full' || variant==='slim' || variant==='button'){
    S.variant = variant;
    activate('variant', variant);
  }

  const err = p.get('err');
  if(err==='none' || ERR_MAP[err]){
    S.armedError = ERR_MAP[err] || null;
    const btn = activate('err', err);
    const dot=document.getElementById('railDot'), banner=document.getElementById('errBanner');
    if(S.armedError && btn){
      dot.classList.add('armed');
      banner.textContent = '⚠ ' + btn.textContent.replace(btn.querySelector('small')?.textContent||'','').trim() + ' armed. ' + (btn.dataset.hint||'');
      banner.style.display='block';
    } else {
      dot.classList.remove('armed');
      banner.style.display='none';
    }
  }

  const context = p.get('context');
  if(context==='embedded' || context==='hosted' || context==='account'){
    activate('context', context);
    setContext(context);
  } else {
    setContext(S.context);
  }
}
applyUrlParams();

function walletCardBrand(n){ n=String(n||'').replace(/\D/g,'');

  if(/^(5[1-5]|2(2[2-9]|[3-6]\d|7[01]|720))/.test(n)) return 'Mastercard'; if(/^(6011|65|64[4-9])/.test(n)) return 'Discover'; if(/^4/.test(n)) return 'Visa'; return null; }

function fmtCardNum(d){ const b=walletCardBrand(d), x=d.slice(0,cardLenFor(b)); return b==='Amex' ? [x.slice(0,4),x.slice(4,10),x.slice(10)].filter(Boolean).join(' ') : x.replace(/(.{4})/g,'$1 ').trim(); }

function ageFromDob(y,m,d){
  const today = new Date();
  let age = today.getFullYear() - y;
  const hadBirthday = (today.getMonth()+1 > m) || (today.getMonth()+1===m && today.getDate() >= d);
  if(!hadBirthday) age--;
  return age;
}
function tierName(t){ return t>0 ? TIERS[t].name : 'Tier 0: Registered'; }
function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function sameMonth(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth(); }
function spentToday(){ const now=new Date(); return S.spendLog.filter(e=>sameDay(e.at,now)).reduce((s,e)=>s+e.amount,0); }
function spentThisMonth(){ const now=new Date(); return S.spendLog.filter(e=>sameMonth(e.at,now)).reduce((s,e)=>s+e.amount,0); }

   admin-only log carrying the certified field set. Nothing here is ever

function mockHex(len){
  let s = '';
  for(let i=0;i<len;i++) s += Math.floor(Math.random()*16).toString(16);
  return s;
}
function ensureSession(){

function logComplianceEvent(eventType, ruleOutcomes, payload){

  S.complianceLog.unshift({
    timestamp: new Date().toISOString(),
    eventType,
    userId: S.email || 'unknown',
    sessionId: S.sessionId,
    requestHash: 'sig_' + mockHex(32),           // mocked signed-request hash, no real signing in this prototype
    ipAddress: '203.0.113.' + (10 + (S.complianceLog.length % 240)), // mocked, RFC 5737 test range
    resolvedLocation: S.resolvedLocation,
    deviceFingerprint: S.deviceFingerprint,

function tierForLimit(value, key){
  if(value<=TIERS[1][key]) return 1;
  if(value<=TIERS[2][key]) return 2;
  if(value<=TIERS[3][key]) return 3;
  return 4; // exceeds even Tier 3
}
/* Returns {ok:true} if the amount can proceed at the user's current tier, else
   {ok:false, blocked:true, reason} when it exceeds even Tier 3, or
   {ok:false, needTier:n} when stepping up would allow it. */
function evaluateLimit(amount){
  const txNeed = tierForLimit(amount, 'txLimit');
  const dayNeed = tierForLimit(spentToday()+amount, 'dayLimit');
  const monthNeed = tierForLimit(spentThisMonth()+amount, 'monthLimit');
  const need = Math.max(txNeed, dayNeed, monthNeed);
  if(need >= 4){
    const reason = monthNeed>=4 ? 'month' : dayNeed>=4 ? 'day' : 'transaction';
    return { ok:false, blocked:true, reason };
  }
  if(need > S.tier) return { ok:false, needTier:need };
  return { ok:true };
}
/* Generic gate used by every money-movement flow. Call with the USD-equivalent amount
   (in whole dollars, not cents) and a callback to run once verification clears. */
function computeDocDob(){
  // Mocked document-DOB extraction (no real OCR in this prototype). Matches the
  // self-attested DOB in the normal case; a legal last name containing "minor"
  // is a demo/test trigger that makes the document reveal an under-18 birthdate,
  // the same way an email containing "flagged" triggers the sanctions-decline path.
  const testUnderage = (S.lastName || '').toLowerCase().includes('minor') || POKET.signupOutcome==='docUnder18';
  if(testUnderage){
    const d = new Date(); d.setFullYear(d.getFullYear() - 10);
    S.docDobMonth = String(d.getMonth() + 1);
    S.docDobDay = String(d.getDate());
    S.docDobYear = String(d.getFullYear());
  } else {
    S.docDobMonth = S.dobMonth; S.docDobDay = S.dobDay; S.docDobYear = S.dobYear;
  }
}
function recheckAgeEligible(){
  // Certified requirement: once a document is verified, self-attestation is not
  // relied upon -- this checks the document-verified DOB, not the self-attested one.
  if(!S.docDobYear) return true; // no document DOB on file (shouldn't happen post-onboarding), don't block
  const age = ageFromDob(parseInt(S.docDobYear,10), parseInt(S.docDobMonth,10), parseInt(S.docDobDay,10));
  return age >= MIN_AGE;
}

function gateAmount(amountUsd, onApproved){
  if(S.simulateGeoBlock){

function pad2(n){ return n<10 ? '0'+n : ''+n; }
function formatTxDate(date){
  if(!date) return '';
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const day = pad2(date.getDate());
  const month = months[date.getMonth()];
  const year = date.getFullYear();
  let hours = date.getHours();
  const minutes = pad2(date.getMinutes());
  const ampm = hours>=12 ? 'PM' : 'AM';
  hours = hours % 12; if(hours===0) hours = 12;
  let tz = '';
  try {
    const parts = new Intl.DateTimeFormat('en-US', {timeZoneName:'short'}).formatToParts(date);
    const tzPart = parts.find(p=>p.type==='timeZoneName');
    tz = tzPart ? tzPart.value : '';
  } catch(e){ tz = ''; }
  return `${day} ${month}, ${year}, ${hours}:${minutes} ${ampm}${tz?' - '+tz:''}`;
}
function addTx(t){
  /* Every transaction notifies, unless its flow already posted its own notification in the same moment. */
  const nBefore = (POKET.identity.notifications||[]).length;

    list.push({ id:'n'+Date.now()+Math.random().toString(36).slice(2,5), type:'transaction', title:t.title || 'Transaction', desc:[amt, t.status && t.status!=='Completed' ? t.status : ''].filter(Boolean).join(' \u00b7 '), ts:Date.now(), read:false });

    status:'Completed',
    reference:genRef(),

function clampFiatOnly(){
  Object.keys(S.fiatOnlyHoldings).forEach(c=>{
    S.fiatOnlyHoldings[c] = Math.max(0, Math.min(S.fiatOnlyHoldings[c]||0, S.cashHoldings[c]||0));
  });
}
function fiatOnlyAmt(cur){ return Math.max(0, Math.min(S.fiatOnlyHoldings[cur]||0, S.cashHoldings[cur]||0)); }
function digitalEligibleAmt(cur){ return Math.max(0, (S.cashHoldings[cur]||0) - fiatOnlyAmt(cur)); }
function debitFiatFirst(cur, amt){ S.fiatOnlyHoldings[cur] = Math.max(0, (S.fiatOnlyHoldings[cur]||0) - Math.max(0,amt)); }
/* Split each currency into a FIAT-ONLY balance and an unrestricted balance, shown as separate rows. */
function cashBuckets(cur){
  const fo = fiatOnlyAmt(cur), open = digitalEligibleAmt(cur);
  const out = [];
  if(fo>0) out.push({bucket:'fiat', balance:fo});
  if(open>0 || fo===0) out.push({bucket:'open', balance:open});
  return out;
}
function bucketBalance(cur, bucket){ return bucket==='fiat' ? fiatOnlyAmt(cur) : digitalEligibleAmt(cur); }
function creditHoldings(asset, amt, network){
  if(!S.holdings[asset]) S.holdings[asset] = {};
  S.holdings[asset][network] = (S.holdings[asset][network]||0) + amt;
}
function walletBalance(){
  let sum = 0;
  Object.keys(S.holdings).forEach(asset=>{
    Object.keys(S.holdings[asset]).forEach(net=>{ sum += S.holdings[asset][net]||0; });
  });
  return sum;
}
function totalCashUSD(){
  let sum = 0;
  Object.keys(S.cashHoldings).forEach(cur=>{ sum += (S.cashHoldings[cur]||0) * (fxToUSD[cur]||1); });
  return Math.round(sum);
}
function aggregateBalance(){ return totalCashUSD() + walletBalance(); }
function debitHoldings(amt){
  let remaining = amt;
  const flat = [];
  Object.keys(S.holdings).forEach(asset=>{
    Object.keys(S.holdings[asset]).forEach(net=>{ flat.push({asset, net, bal:S.holdings[asset][net]||0}); });
  });
  flat.sort((a,b)=>b.bal-a.bal);
  for(const row of flat){
    if(remaining<=0) break;
    const take = Math.min(row.bal, remaining);
    S.holdings[row.asset][row.net] -= take;
    remaining -= take;
  }
}

function bindOtpBoxes(rowId, buttonId){
  const row = document.getElementById(rowId);
  if(!row) return;
  const boxes = Array.from(row.querySelectorAll('.otp-box'));
  const btn = document.getElementById(buttonId);
  let autoSubmitted = false;
  const maybeAutoSubmit = ()=>{
    const complete = boxes.every(b=>b.value.length===1);
    if(complete && btn && !btn.disabled && !autoSubmitted){
      autoSubmitted = true;
      setTimeout(()=>{ if(btn) btn.click(); }, 350);
    }
    return complete;
  };
  boxes.forEach((box,i)=>{
    box.oninput = e=>{
      e.target.value = e.target.value.replace(/[^0-9]/g,'').slice(0,1);
      e.target.classList.toggle('filled', !!e.target.value);
      if(e.target.value && boxes[i+1]) boxes[i+1].focus();
      const complete = boxes.every(b=>b.value.length===1);
      if(btn) btn.disabled = !complete;
      maybeAutoSubmit();
    };
    box.onkeydown = e=>{
      if(e.key==='Backspace' && !e.target.value && boxes[i-1]) boxes[i-1].focus();
    };
    box.onpaste = e=>{
      e.preventDefault();
      const digits = (e.clipboardData.getData('text')||'').replace(/[^0-9]/g,'').slice(0,6).split('');
      digits.forEach((d,j)=>{ if(boxes[j]){ boxes[j].value=d; boxes[j].classList.add('filled'); } });
      const last = boxes[Math.min(digits.length,6)-1];
      if(last) last.focus();
      if(btn) btn.disabled = !boxes.every(b=>b.value.length===1);
      maybeAutoSubmit();
    };
  });
  boxes[0].focus();
}

function formatBytes(b){
  if(b<1024) return b+' B';
  if(b<1024*1024) return (b/1024).toFixed(0)+' KB';
  return (b/1024/1024).toFixed(1)+' MB';
}

function assetDelta(seed, balanceCents){
  if(!balanceCents) return null;
  const rand = seededRandom(seed+'-24h-'+new Date().toDateString());
  const pct = (rand()-0.5)*0.3; // typical small stablecoin peg drift, roughly -0.15% to +0.15%
  const amtCents = balanceCents * pct/100;
  return {pct, amtCents};
}

function greyCurrencyCodes(){ const body=document.getElementById('panelBody'); if(!body) return;
  const re=/([\d.,]+\s?)(USD|NGN|EUR|GBP|GHS|USDC|USDT)\b/;
  const walker=body.ownerDocument.createTreeWalker(body, NodeFilter.SHOW_TEXT, { acceptNode:n=> (n.parentElement && !n.parentElement.closest('input,textarea,select,option,button.dd-row,.cur-code,.fiat-tag') && re.test(n.nodeValue) && /(USD|NGN|EUR|GBP|GHS)\b/.test(n.nodeValue)) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT });
  const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n=>{ const html=n.nodeValue.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/([\d.,]+)\s?(USD|NGN|EUR|GBP|GHS)\b/g,'$1 <span class="cur-code">$2</span>'); const s=body.ownerDocument.createElement('span'); s.innerHTML=html; n.replaceWith(...s.childNodes); }); }
function enhanceSelects(){
  const body = document.getElementById('panelBody'); if(!body) return;
  body.querySelectorAll('select:not([data-native]):not([data-enh])').forEach(sel=>{
    sel.dataset.enh='1'; sel.style.display='none';
    const btn=document.createElement('button'); btn.type='button'; btn.className='dd-btn field-input'; btn.setAttribute('aria-haspopup','dialog');
    const lbl=sel.id && body.querySelector(`label[for="${sel.id}"]`); if(lbl && !btn.id){ btn.id = sel.id+'Btn'; lbl.setAttribute('for', btn.id); }
    const paint=()=>{ const o=sel.options[sel.selectedIndex]; btn.innerHTML=`<span class="${o && o.value!==''?'':'dd-ph'}">${o ? o.textContent : 'Choose'}</span><svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`; btn.disabled = sel.disabled; };
    paint(); sel.after(btn);
    btn.onclick=()=>openDdSheet(sel, lbl ? lbl.textContent.trim() : 'Choose', ()=>{ paint(); });
  });
}
function openDdSheet(sel, title, done){
  const panel = document.querySelector('.panel'); if(!panel) return;
  let sh = panel.querySelector('.dd-sheet'); if(sh) sh.remove();
  sh = document.createElement('div'); sh.className='dd-sheet'; sh.setAttribute('role','dialog'); sh.setAttribute('aria-label', title);
  const opts=[...sel.options].filter(o=>o.value!=='' || !o.disabled);
  const many = opts.length>8;
  const draw=q=>{ q=(q||'').toLowerCase(); const list=opts.filter(o=>!q || o.textContent.toLowerCase().includes(q));
    return list.length ? list.map(o=>`<button type="button" class="dd-row ${o.value===sel.value?'on':''}" data-v="${String(o.value).replace(/"/g,'&quot;')}"><span>${o.textContent}</span>${o.value===sel.value?'<span class="dd-check">\u2713</span>':''}</button>`).join('') : `<p class="dd-empty">Nothing matches \u201c${q}\u201d.</p>`; };
  sh.innerHTML = `<div class="dd-head"><b>${title}</b><button type="button" class="dd-x" aria-label="Close">\u2715</button></div>${many?'<div class="dd-search"><input type="search" placeholder="Search" aria-label="Search"></div>':''}<div class="dd-list">${draw('')}</div>`;
  panel.appendChild(sh);
  const bindRows=()=>sh.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{ sel.value=b.dataset.v; sh.remove(); sel.dispatchEvent(new Event('change',{bubbles:true})); sel.dispatchEvent(new Event('input',{bubbles:true})); done(); });
  bindRows(); sh.querySelector('.dd-x').onclick=()=>sh.remove();
  const s=sh.querySelector('.dd-search input'); if(s){ s.oninput=()=>{ sh.querySelector('.dd-list').innerHTML=draw(s.value); bindRows(); }; setTimeout(()=>s.focus(),30); }
  sh.onkeydown=e=>{ if(e.key==='Escape'){ e.stopPropagation(); sh.remove(); } };
  const on=sh.querySelector('.dd-row.on'); if(on) on.scrollIntoView({block:'nearest'});
}

function detailIconInfo(label, value){
  const v = String(value||'').toLowerCase();
  if(label==='Network' && (v==='base'||v==='polygon')) return {icon:icons[v], real:true, generic:icons.network};
  if(label==='Asset' && (v==='usdc'||v==='usdt')) return {icon:icons[v], real:true, generic:icons.coins};
  if(label==='Currency' || label==='Paid'){
    const str = String(value||'');
    const curMatch = Object.keys(currencyInfo).find(c => str===c || str.indexOf(c)>-1 || (currencyInfo[c].symbol && str.indexOf(currencyInfo[c].symbol)>-1));
    if(curMatch) return {icon:icons[currencyInfo[curMatch].icon], real:true, generic:icons.globe};
  }
  const map = {
    'Status':'check', 'Date':'calendar',
    'Card':'card', 'Statement descriptor':'hash',
    'Fee':'percent', 'Processing fee':'percent', 'Network fee':'percent',
    'To':'user', 'Recipient':'user', 'Handle':'user', 'From':'user',
    'Bank':'bank', 'Account':'hash', 'Merchant':'store', 'Zelle':'mail', 'Cash App':'hash'
  };
  return {icon:icons[map[label]] || icons.activity, real:false};
}
function detailRowHtml(label, value){
  const info = detailIconInfo(label, value);
  const isStatus = label==='Status' && /completed|confirmed|approved/i.test(String(value));
  const labelIcon = info.real ? info.generic : info.icon;
  const isDate = label==='Date' && typeof value==='string';
  const dateHtml = isDate ? value.replace(/ - (\S+)$/, ' - <em>$1</em>') : value;
  const valueHtml = info.real
    ? `<span style="display:inline-flex;align-items:center;gap:6px;justify-content:flex-end"><span class="icon-16">${info.icon}</span>${value}</span>`
    : dateHtml;
  return `<div class="info-row">
    <span style="display:inline-flex;align-items:center;gap:10px"><span class="detail-ic">${labelIcon}</span>${label}</span>
    <span class="mono" style="${isDate?'white-space:nowrap;margin-left:12px;':'max-width:190px;word-break:break-word;'}text-align:right;${isStatus?'color:var(--ok-600);font-weight:600':''}">${valueHtml}</span>
  </div>`;
}

function walletAccountId(){
  let h = 0;
  const seed = S.email || 'user';
  for(let i=0;i<seed.length;i++){ h = (h*31 + seed.charCodeAt(i)) >>> 0; }
  return 'CTOS-' + (100000 + (h % 900000));
}
const networkInfo = {
  Polygon:{icon:'polygon', dotIcon:'polygonDot', min:'1.00', conf:'128 confirmations', eta:'~2 min'},
  Base:{icon:'base', dotIcon:'baseDot', min:'1.00', conf:'12 confirmations', eta:'~15 sec'}
};

function seededRandom(seed){
  let h = 0;
  for(let i=0;i<seed.length;i++){ h = (h*31 + seed.charCodeAt(i)) >>> 0; }
  return function(){ h = (h*1103515245 + 12345) >>> 0; return (h >>> 8) / 0x1000000; };
}

const ngBanks = ['GTBank','Access Bank','Zenith Bank','UBA','First Bank of Nigeria','Union Bank','Fidelity Bank','Sterling Bank','Wema Bank','Ecobank Nigeria'];
const ngFirstNames = ['Adaeze','Chinedu','Ngozi','Emeka','Amaka','Tunde','Folake','Ibrahim','Aisha','Chukwuemeka'];
const ngLastNames = ['Okafor','Balogun','Eze','Abubakar','Adeyemi','Nwosu','Okonkwo','Yusuf','Bello','Chukwu'];

function resolveUsBankName(routing){
  if((routing||'').length!==9) return '';
  const rand = seededRandom('rt'+routing);
  return usBanks[Math.floor(rand()*usBanks.length)];
}
function resolveNgAccountName(accountNumber, bank){
  if((accountNumber||'').length!==10 || !bank) return '';
  const rand = seededRandom('acct'+accountNumber+bank);
  return ngFirstNames[Math.floor(rand()*ngFirstNames.length)] + ' ' + ngLastNames[Math.floor(rand()*ngLastNames.length)];
}

function buildQr(seed, iconKey){
  const modules = 21, size = 132, margin = 3;
  const cell = (size - margin*2) / modules;
  const rand = seededRandom(seed);
  const isFinder = (x,y)=> (x<7&&y<7) || (x>=14&&y<7) || (x<7&&y>=14);
  const isCenter = (x,y)=> x>=8 && x<=12 && y>=8 && y<=12;
  const isSep = (x,y)=> x===7||x===13||y===7||y===13;
  let modulesSvg = '';
  for(let y=0;y<modules;y++){
    for(let x=0;x<modules;x++){
      if(isFinder(x,y) || isCenter(x,y) || isSep(x,y)) continue;
      if(rand() > 0.55){
        modulesSvg += `<rect x="${(margin+x*cell).toFixed(2)}" y="${(margin+y*cell).toFixed(2)}" width="${cell.toFixed(2)}" height="${cell.toFixed(2)}" fill="#111213"/>`;
      }
    }
  }
  function finder(fx,fy){
    return `<rect x="${(margin+fx*cell).toFixed(2)}" y="${(margin+fy*cell).toFixed(2)}" width="${(cell*7).toFixed(2)}" height="${(cell*7).toFixed(2)}" fill="#111213"/>`
      + `<rect x="${(margin+(fx+1)*cell).toFixed(2)}" y="${(margin+(fy+1)*cell).toFixed(2)}" width="${(cell*5).toFixed(2)}" height="${(cell*5).toFixed(2)}" fill="#fff"/>`
      + `<rect x="${(margin+(fx+2)*cell).toFixed(2)}" y="${(margin+(fy+2)*cell).toFixed(2)}" width="${(cell*3).toFixed(2)}" height="${(cell*3).toFixed(2)}" fill="#111213"/>`;
  }
  modulesSvg += finder(0,0) + finder(14,0) + finder(0,14);
  const centerSize = cell*5;
  const centerX = margin + 8*cell, centerY = margin + 8*cell;
  const iconPad = 5;
  const iconSize = centerSize - iconPad*2;
  const iconInner = (icons[iconKey]||'').replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'');
  modulesSvg += `<rect x="${centerX.toFixed(2)}" y="${centerY.toFixed(2)}" width="${centerSize.toFixed(2)}" height="${centerSize.toFixed(2)}" rx="5" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>`;
  modulesSvg += `<svg x="${(centerX+iconPad).toFixed(2)}" y="${(centerY+iconPad).toFixed(2)}" width="${iconSize.toFixed(2)}" height="${iconSize.toFixed(2)}" viewBox="0 0 32 32">${iconInner}</svg>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${modulesSvg}</svg>`;
}

function buyFee(amtUsdCents){ return Math.round(amtUsdCents*0.005); }
function toUsdCents(amtCents, currency){ return Math.round(amtCents * (fxToUSD[currency]||1)); }

function activeFundingCard(){
  if(S.selectedCardId){
    const c = S.savedCards.find(c=>c.id===S.selectedCardId);
    if(c) return c;
  }
  const digits = (S.cardNumber||'').replace(/\s/g,'');
  return { last4: digits.slice(-4), brand: walletCardBrand(digits) || 'Card' };
}
function cardFundFee(amtCents, currency){
  currency = currency || 'USD';
  const flatFee = currency==='NGN' ? Math.round(0.30 * 1550 * 100) : 30;
  return Math.round(amtCents*0.029) + flatFee;
}
function sendFee(currency){
  currency = currency || 'USD';
  return currency==='NGN' ? Math.round(1 * 1550 * 100) : 100; // flat $1.00 equivalent
}
/* ---------- withdrawal / settlement ---------- */
function withdrawFee(currency, speed, amtCents){
  if(speed==='instant'){
    const pct = Math.round((amtCents||0) * 0.015);
    const min = currency==='NGN' ? Math.round(1 * 1550 * 100) : 100; // ~$1 equivalent minimum
    return Math.max(pct, min);
  }
  return currency==='NGN' ? Math.round(0.5 * 1550 * 100) : 50; // ~$0.50 equivalent flat fee for standard bank transfer
}
function withdrawEta(speed){
  return speed==='instant' ? 'Within 30 minutes' : '1-3 business days';
}
function isExpiryValid(expiry){
  const m = (expiry||'').match(/^(\d{2})\/(\d{4})$/);
  if(!m) return false;
  const month = parseInt(m[1],10);
  const year = parseInt(m[2],10);
  if(month<1 || month>12) return false;
  const now = new Date();
  if(year < now.getFullYear()) return false;
  if(year === now.getFullYear() && month < now.getMonth()+1) return false;
  return true;
}

/* ---------- remittance: cross-currency + disclosures ---------- */
const fxRateNote = { USD:'Rates shown are indicative and may change until you confirm.', NGN:'Rates shown are indicative and may change until you confirm.' };
function convertAmount(cents, fromCur, toCur){
  if(fromCur===toCur) return cents;
  const usd = cents * fxToUSD[fromCur];
  return Math.round(usd / fxToUSD[toCur]);
}
function fxRateLabel(fromCur, toCur){
  const oneFromInUsd = fxToUSD[fromCur];
  const equivInTo = Math.round((oneFromInUsd / fxToUSD[toCur]) * 10000) / 10000;
  return `1 ${fromCur} = ${equivInTo.toLocaleString(undefined,{maximumFractionDigits:4})} ${toCur}`;
}
function deliveryEta(fromCur, toCur){
  return fromCur===toCur ? 'Within minutes' : '1-2 business days';
}
function isCrossBorder(r){ return r && r.type==='cash' && r.currency!==S.sendCurrency; }

function payoutFmt(cents){ return fmtCurrency(cents, S.payoutCurrency); }
function payoutRecipientList(){
  const mine = S.linkedBanks.map(b=>({ id:b.id, isSelf:true, name:b.nickname, bankName:b.bankName, accountNumber:b.accountNumber, routingNumber:b.routingNumber, currency:b.currency, methodType:b.methodType||'bank', zelleContact:b.zelleContact, cashtag:b.cashtag }));
  const others = S.recipients.filter(r=>r.type==='cash').map(r=>({ id:r.id, isSelf:false, name:r.name, bankName:r.bankName, accountNumber:r.accountNumber, routingNumber:r.routingNumber, currency:r.currency, methodType:r.methodType||'bank', railType:r.railType, cardNumber:r.cardNumber, zelleContact:r.zelleContact, cashtag:r.cashtag, address:r.address, zip:r.zip }));
  return { mine, others };
}
function payoutMethodIcon(r){
  if(r.methodType==='card') return icons.card;
  if(r.methodType==='zelle') return icons.zelleLogo;
  if(r.methodType==='cashapp') return icons.cashappLogo;
  return icons.bank;
}
function payoutMethodBadgeHtml(r){
  const isLogo = r.methodType==='zelle' || r.methodType==='cashapp';
  const icon = payoutMethodIcon(r);
  return isLogo ? icon : `<span style="display:inline-flex;color:var(--txt2)">${icon}</span>`;
}
function payoutMethodSub(r){
  if(r.methodType==='card'){
    if(r.cardNumber) return `\u2022\u2022\u2022\u2022 ${r.cardNumber.replace(/\D/g,'').slice(-4)}`;
    return r.accountNumber || '';
  }
  if(r.methodType==='zelle') return `Zelle \u00b7 ${r.zelleContact||''}`;
  if(r.methodType==='cashapp') return `${r.cashtag||''}`;
  const acct = r.accountNumber||'';
  const maskedAcct = acct.length>4 ? `\u2022\u2022\u2022\u2022 ${acct.slice(-4)}` : acct;
  return `${r.bankName} \u00b7 ${maskedAcct}`;
}
function formatCardNumber(raw){
  const digits = String(raw||'').replace(/\D/g,'').slice(0,16);
  return (digits.match(/.{1,4}/g)||[]).join(' ');
}

function tPayout(){
  if(S.payoutStage==='currency'){

      .filter(c=> !q || c.toLowerCase().includes(q) || currencyInfo[c].name.toLowerCase().includes(q))

        const aSel = !S.payoutIsCrypto && S.payoutCurrency===a;

      });

      const aSel = S.payoutIsCrypto && S.payoutAsset===a.asset && S.payoutNetwork===a.network;

    });
    return `
    <button class="back-row" id="backHome">${icons.back} Wallet</button>

/* ---------- wallet to wallet ---------- */
function w2wFmt(cents){ return S.w2wType==='crypto' ? fmt(cents) : fmtCurrency(cents, S.w2wCurrency); }

function tW2W(){
  if(S.w2wStage==='balance'){
    const q = (S.w2wCurrencySearch||'').trim().toLowerCase();
    const cashOptions = Object.keys(S.cashHoldings)
      .filter(c=> !q || c.toLowerCase().includes(q) || currencyInfo[c].name.toLowerCase().includes(q))
      .sort((a,b)=>{
        const aSel = S.w2wType==='cash' && S.w2wCurrency===a;
        const bSel = S.w2wType==='cash' && S.w2wCurrency===b;
        if(aSel!==bSel) return aSel ? -1 : 1;
        return 0;
      });
    const cryptoOptions = stablecoinRows().filter(a=> !q || a.asset.toLowerCase().includes(q) || a.network.toLowerCase().includes(q) || a.name.toLowerCase().includes(q));
    cryptoOptions.sort((a,b)=>{
      const aSel = S.w2wType==='crypto' && S.w2wAsset===a.asset && S.w2wNetwork===a.network;
      const bSel = S.w2wType==='crypto' && S.w2wAsset===b.asset && S.w2wNetwork===b.network;
      if(aSel!==bSel) return aSel ? -1 : 1;
      return 0;
    });
    return `
    <button class="back-row" id="backHome">${icons.back} Wallet</button>
    <div class="step-title">Transfer</div>
    <p class="step-sub">Choose which balance to send from. Transfer moves money between Poket accounts, instantly.</p>
    <div class="field-icon-wrap">
      <span class="field-icon">${icons.search}</span>
      <input class="field-input" id="w2wCurrencySearch" placeholder="Search currency or stablecoin" value="${S.w2wCurrencySearch||''}">
    </div>

    </div>

  }
  if(S.w2wStage==='sending'){
    return `<div class="center-col" style="padding-top:50px">
      <div class="sending-dots"><span></span><span></span><span></span></div>
      <div class="step-title" style="margin-top:18px">Transferring&hellip;</div>
    </div>`;
  }
  if(S.w2wStage==='done'){
    const r = S.w2wRecipient;
    const isCrypto = S.w2wType==='crypto';
    const currencyIcon = isCrypto ? icons[S.w2wAsset.toLowerCase()] : icons[currencyInfo[S.w2wCurrency].icon];
    return `<div class="center-col" style="padding-bottom:0">
      <div class="asset-icon-wrap" style="margin-bottom:14px">
        <div class="check-circle" style="margin-bottom:0">${icons.check}</div>
        <span class="check-badge">${currencyIcon}</span>
      </div>
      <div class="step-title mono" style="margin-top:2px;font-size:26px">${w2wFmt(S.w2wCents||0)}</div>
      <p class="step-sub">Sent instantly</p>

      <div class="receipt-row"><span class="r-ic">${icons.user}</span><span class="r-label">To</span><span class="r-value mono">${r?r.name:''}</span></div>

    </div>
    <button class="btn-primary" id="w2wDone" style="margin-top:18px">Done</button>`;
  }
}

function positionOpenDropdownMenus(){
  const panel = document.querySelector('.panel');
  if(!panel) return;
  const panelRect = panel.getBoundingClientRect();
  document.querySelectorAll('.dropdown-menu').forEach(menu=>{
    const trigger = menu.parentElement.querySelector('[data-dropdown-toggle]');
    if(!trigger) return;
    const triggerRect = trigger.getBoundingClientRect();
    const spaceBelow = panelRect.bottom - triggerRect.bottom;
    const menuHeight = menu.offsetHeight;
    if(spaceBelow < menuHeight + 12){
      menu.style.top = 'auto';
      menu.style.bottom = 'calc(100% + 6px)';
    } else {
      menu.style.top = '';
      menu.style.bottom = '';
    }
  });
}
function bind(){
  const $ = id => document.getElementById(id);

  document.querySelectorAll('[data-dropdown-toggle]').forEach(el=>el.onclick=(e)=>{
    e.stopPropagation();
    const id = el.dataset.dropdownToggle;
    S.openDropdown = S.openDropdown===id ? null : id;
    render();
  });
  document.querySelectorAll('[data-dropdown-option]').forEach(el=>el.onclick=(e)=>{
    e.stopPropagation();
    const sep = el.dataset.dropdownOption.indexOf('::');
    const id = el.dataset.dropdownOption.slice(0, sep);
    const value = el.dataset.dropdownOption.slice(sep+2);
    S.openDropdown = null;
    onDropdownSelect(id, value);
  });
  positionOpenDropdownMenus();

  if($('goSignup')) $('goSignup').onclick = ()=>go('onboard-email');
  if($('goLogin')) $('goLogin').onclick = ()=>go('onboard-login');
  if($('goLoginFromSignup')) $('goLoginFromSignup').onclick = ()=>go('onboard-login');
  if($('goSignupFromLogin')) $('goSignupFromLogin').onclick = ()=>go('onboard-email');
  if($('backToWelcome')) $('backToWelcome').onclick = ()=>{ stopResendTimer(); S.loginCodeSent=false; go('onboard-welcome'); };

  document.querySelectorAll('[data-loginmethod]').forEach(el=>el.onclick=()=>{
    S.loginMethod=el.dataset.loginmethod;
    if(S.loginCodeSent){ S.loginCodeSent=false; stopResendTimer(); }
    render();
  });
  if($('loginEmailInput')) $('loginEmailInput').oninput = e=>{
    S.loginEmail = e.target.value;
    if(S.loginCodeSent){ S.loginCodeSent=false; stopResendTimer(); render(); return; }
    if($('sendLoginCode')) $('sendLoginCode').disabled = !S.loginEmail.trim();
  };
  if($('loginPhoneCodeSelect')) $('loginPhoneCodeSelect').onchange = e=>{ S.loginPhoneCode=e.target.value; };
  if($('loginPhoneInput')) $('loginPhoneInput').oninput = e=>{
    const formatted = formatPhoneInput(e.target.value);
    e.target.value = formatted;
    S.loginPhone = formatted;
    if(S.loginCodeSent){ S.loginCodeSent=false; stopResendTimer(); render(); return; }
    if($('sendLoginCode')) $('sendLoginCode').disabled = !S.loginPhone.trim();
  };
  if($('sendLoginCode')) $('sendLoginCode').onclick = e=>{
    const identifier = S.loginMethod==='email' ? S.loginEmail : S.loginPhone;
    if(!identifier || !identifier.trim()) return;
    withSpinner(e.currentTarget, 800, ()=>{
      S.loginCodeSent = true;
      render();
      startResendTimer('resendLoginOtp');
    });
  };
  if($('loginOtpRow')) bindOtpBoxes('loginOtpRow','verifyLoginOtp');
  if($('verifyLoginOtp')) $('verifyLoginOtp').onclick = e=>{
    withSpinner(e.currentTarget, 900, ()=>{
      stopResendTimer();
      if(!POKET.identity.exists){
        S.loginCodeSent = false;
        if(S.loginMethod==='email'){ S.signupMethod='email'; S.email = S.loginEmail; } else { S.signupMethod='phone'; S.phone = S.loginPhone; }
        S.signupNotice = 'No Poket account uses this ' + (S.loginMethod==='email' ? 'email' : 'phone number') + ' yet. You\u2019ve confirmed it, so just accept the terms to create your account.';
        S.preVerified = S.loginMethod==='email' ? S.loginEmail.trim().toLowerCase() : S.loginPhone.replace(/\D/g,'');
        go('onboard-email');
        return;
      }
      if(!S.email && S.loginMethod==='email') S.email = S.loginEmail;
      S.loginCodeSent = false;
      go('login-geo');
      setTimeout(()=>{
        if(S.simulateGeoBlock){
          logComplianceEvent('login', { geoCheck:'blocked' }, { outcome:'blocked' });
          go('login-geo-blocked');
          return;
        }
        S.geoVerified = true;
        logComplianceEvent('login', { geoCheck:'passed' }, { outcome:'success' });
        go('home','home');
        document.getElementById('launcher').style.display='block';
      }, 1100);
    });
  };
  if($('resendLoginOtp')) $('resendLoginOtp').onclick = ()=>{
    if(S.resendSeconds>0) return;
    startResendTimer('resendLoginOtp');
    $('resendLoginOtp').textContent = `Resend (${S.resendSeconds}s)`;
  };

  document.querySelectorAll('[data-signupmethod]').forEach(el=>el.onclick=()=>{
    S.signupMethod=el.dataset.signupmethod;
    if(S.signupCodeSent){ S.signupCodeSent=false; stopResendTimer(); }
    render();
  });
  if($('signupEmailInput')) $('signupEmailInput').oninput = e=>{
    S.email=e.target.value;
    if(S.signupCodeSent){ S.signupCodeSent=false; stopResendTimer(); render(); return; }

  };
  if($('goLoginFromSignup')) $('goLoginFromSignup').addEventListener('click', ()=>{ S.signupNotice=null; });
  if($('signupTermsCheck')) $('signupTermsCheck').onchange = e=>{ S.signupTermsAccepted = e.target.checked; checkOnboardForm(); };
  document.querySelectorAll('.consent-link').forEach(l=>{ l.setAttribute('role','link'); l.tabIndex=0; const go=e=>{ e.preventDefault(); e.stopPropagation(); window.open(l.dataset.doc==='privacy' ? 'https://onepoket.com/privacy-policy' : 'https://onepoket.com/terms-and-conditions', '_blank', 'noopener'); }; l.onclick=go; l.onkeydown=e=>{ if(e.key==='Enter') go(e); }; });
  if($('signupPhoneCodeSelect')) $('signupPhoneCodeSelect').onchange = e=>{ S.phoneCode=e.target.value; };
  if($('signupPhoneInput')) $('signupPhoneInput').oninput = e=>{
    const formatted = formatPhoneInput(e.target.value);
    e.target.value = formatted;
    S.phone = formatted;
    if(S.signupCodeSent){ S.signupCodeSent=false; stopResendTimer(); render(); return; }
    checkOnboardForm();
  };
  if($('signupFirst')) $('signupFirst').oninput = e=>{ S.firstName = e.target.value; S._namesFromSignup = true; checkOnboardForm(); };
  if($('signupLast')) $('signupLast').oninput = e=>{ S.lastName = e.target.value; S._namesFromSignup = true; checkOnboardForm(); };
  if($('continueEmail')) $('continueEmail').onclick = e=>{

  function checkCardForm(){
    const nameMatch = S.cardName && S.legalName && S.cardName.trim().toLowerCase()===S.legalName.trim().toLowerCase();
    const expiryFilled = S.cardExpiry.length===7;
    const expiryOk = !expiryFilled || isExpiryValid(S.cardExpiry);
    const cDigits = S.cardNumber.replace(/\D/g,''), cBrand = walletCardBrand(cDigits);
    const cvvOk = S.cardCvv.length===cvcLenFor(cBrand);
    const zipOk = /^\d{5}(-\d{4})?$/.test(S.cardZip);
    const cardComplete = !!cBrand && cDigits.length===cardLenFor(cBrand) && expiryFilled && expiryOk && cvvOk && zipOk && S.cardName;
    const mk=$('cardBrandMark'); if(mk) mk.innerHTML = cBrand ? brandMark(cBrand) : '';
    const nh=$('cardNumHint'); if(nh) nh.style.display = (cDigits.length>=4 && !cBrand) ? 'block' : 'none';
    const cv=$('cardCvvInput'); if(cv){ cv.maxLength=cvcLenFor(cBrand); cv.placeholder = cBrand==='Amex' ? '1234' : 'CVC'; }
    const hint = $('nameMatchHint');
    if(hint){
      hint.style.display = S.cardName ? 'block' : 'none';
      hint.textContent = nameMatch ? 'Matches verified account holder' : `Must match account holder: ${S.legalName}`;
      hint.style.color = nameMatch ? 'var(--ok-600)' : 'var(--err-600)';

      if(aSel!==bSel) return aSel ? -1 : 1;
      return 0;
    });

    if(!el) return;
    el.innerHTML = list.map(d=>{
      const sel = S.w2wRecipient && S.w2wRecipient.handle===d.handle;

  if($('w2wRecipientContinue')) $('w2wRecipientContinue').onclick = e=>withSpinner(e.currentTarget, 500, ()=>{ S.w2wCents=0; S.w2wStage='amount'; render(); });

  if($('backToW2wRecipientList')) $('backToW2wRecipientList').onclick = ()=>{ S.w2wStage='recipient'; render(); };
  function checkW2wDraft(){
    const d = S.w2wRecipientDraft;
    const idType = d.idType || 'tag';
    let ready = false;
    if(idType==='tag') ready = !!(d.idValue && d.idValue.startsWith('@') && d.idValue.length>2);
    else if(idType==='email') ready = !!(d.idValue && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.idValue));
    else ready = !!(d.idValue && d.idValue.replace(/\D/g,'').length>=7);
    const btn = $('saveW2wRecipientBtn');
    if(btn) btn.disabled = !ready;
  }
  if($('w2wIdValueInput')) $('w2wIdValueInput').oninput = e=>{

    checkW2wDraft();
  };
  if($('w2wNicknameInput')) $('w2wNicknameInput').oninput = e=>{ S.w2wRecipientDraft.nickname=e.target.value; checkW2wDraft(); };
  if($('saveW2wRecipientBtn')) $('saveW2wRecipientBtn').onclick = e=>{
    const d = S.w2wRecipientDraft;
    const idType = d.idType||'tag';
    const fullHandle = idType==='phone' ? `${d.phoneCountry||'+1'} ${d.idValue}` : d.idValue;
    const displayName = (d.nickname||'').trim() || fullHandle;
    const initials = displayName.split(' ').map(s=>s.charAt(0).toUpperCase()).slice(0,2).join('') || '?';
    const newContact = { name:displayName, handle:fullHandle, idType, initials };
    withSpinner(e.currentTarget, 500, ()=>{
      S.w2wContacts.push(newContact);
      S.w2wRecipient = newContact;
      S.w2wStage = 'recipient';
      render();
    });
  };

  if($('backToW2wRecipient')) $('backToW2wRecipient').onclick = ()=>{ S.w2wStage='recipient'; render(); };
  if($('editW2wRecipient')) $('editW2wRecipient').onclick = ()=>{ S.w2wStage='recipient'; render(); };
  document.querySelectorAll('[data-w2wkey]').forEach(el=>el.onclick=()=>{
    const k = el.dataset.w2wkey;
    let cents = S.w2wCents||0;
    if(k==='back'){ cents = Math.floor(cents/10); }
    else {
      if(cents >= 100000000) return;
      cents = cents*10 + parseInt(k,10);
    }
    S.w2wCents = cents;
    render();
  });
  if($('w2wMaxAmt')) $('w2wMaxAmt').onclick = ()=>{
    const isCrypto = S.w2wType==='crypto';
    const avail = isCrypto ? ((S.holdings[S.w2wAsset]&&S.holdings[S.w2wAsset][S.w2wNetwork])||0) : (S.cashHoldings[S.w2wCurrency]||0);
    const fee = sendFee(isCrypto?'USD':S.w2wCurrency);
    S.w2wCents = Math.max(0, avail - fee);
    render();
  };
  if($('w2wReview')) $('w2wReview').onclick = e=>{
    const isCrypto = S.w2wType==='crypto';
    const amtCents = S.w2wCents||0;
    const avail = isCrypto ? ((S.holdings[S.w2wAsset]&&S.holdings[S.w2wAsset][S.w2wNetwork])||0) : (S.cashHoldings[S.w2wCurrency]||0);
    const fee = sendFee(isCrypto?'USD':S.w2wCurrency);
    if(amtCents<=0 || (amtCents+fee)>avail) return;
    withSpinner(e.currentTarget, 500, ()=>{ S.w2wStage='summary'; render(); });
  };

  if($('backToW2wAmount')) $('backToW2wAmount').onclick = ()=>{ S.w2wStage='amount'; render(); };
  if($('confirmW2W')) $('confirmW2W').onclick = e=>{
    const isCrypto = S.w2wType==='crypto';
    const amt = S.w2wCents||0;
    const usdAmt = isCrypto ? amt/100 : toUsdCents(amt, S.w2wCurrency)/100;
    const proceedWithAmountGate = ()=>{
    gateAmount(usdAmt, ()=>{
      withSpinner(e.currentTarget, 500, ()=>{
        S.w2wStage='sending'; render();
        setTimeout(()=>{
          const fee = sendFee(isCrypto?'USD':S.w2wCurrency);
          const total = amt + fee;
          const r = S.w2wRecipient;
          if(isCrypto){
            const w2wAvail = (S.holdings[S.w2wAsset]&&S.holdings[S.w2wAsset][S.w2wNetwork])||0;
            const fromAsset = Math.min(total, w2wAvail);
            S.holdings[S.w2wAsset][S.w2wNetwork] = w2wAvail - fromAsset;
            if(total - fromAsset > 0) debitHoldings(total - fromAsset);
            addTx({type:'w2w', title:`Transfer to ${r.name}`, sub:`${S.w2wNetwork} \u00b7 internal`, amount:amt, positive:false, details:{ 'Recipient':r.name, 'Handle':r.handle, 'Asset':S.w2wAsset, 'Network':S.w2wNetwork, 'Fee':w2wFmt(fee) }});
          } else {
            S.cashHoldings[S.w2wCurrency] = (S.cashHoldings[S.w2wCurrency]||0) - total; debitFiatFirst(S.w2wCurrency, total);
            addTx({type:'w2w', title:`Transfer to ${r.name}`, sub:`${S.w2wCurrency} \u00b7 internal`, amount:amt, positive:false, details:{ 'Recipient':r.name, 'Handle':r.handle, 'Currency':S.w2wCurrency, 'Fee':w2wFmt(fee) }});
          }
          recordSpend(usdAmt);
          S.lastW2wRef = genRef();
          S.w2wStage='done'; render();
        }, 1400);
      });
    });
    };
    if(isCrypto){ gateAddress(S.w2wRecipient.handle, proceedWithAmountGate); }
    else { proceedWithAmountGate(); }
  };
  if($('viewW2wTx')) $('viewW2wTx').onclick = ()=>{ if(S.txns[0]){ S.selectedTx=S.txns[0]; go('tx-detail'); } };
  if($('w2wDone')) $('w2wDone').onclick = ()=>{
    S.w2wCents=0; S.w2wRecipient=null; S.w2wAsset=null; S.w2wNetwork=null; S.w2wRecipientDraft={}; S.w2wStage='balance'; S.lastW2wRef=null; S.w2wCurrencySearch='';
    go('home','home');
  };
}

/* ===== unified: wallet engine API used by the checkout surface ===== */
POKET.wallet = (function(){
  const host = POKET._walletHost;
  let onReturn = null, kind = null;          // kind: 'task' (one flow, returns to checkout) | 'account' (full app)
  const isModal = () => POKET.walletMode === 'modal';
  const _go = go;
  function close(){
    if(!isModal()) return;
    host.classList.remove('as-modal','as-task'); host.style.display = 'none';
    POKET.walletMode = 'hidden'; kind = null; if(POKET.setProtoActions) POKET.setProtoActions([]);
    S.screen = 'home'; S.tab = 'home';
    const cb = onReturn; onReturn = null;
    if(POKET.checkout) POKET.checkout.refresh();
    if(cb) cb();
  }
  go = function(screen, tab){
    if(isModal() && kind==='task' && (screen==='home' || screen==='onboard-welcome')){ close(); return; }
    if(isModal() && kind==='account' && screen==='onboard-welcome'){ close(); return; }
    _go(screen, tab);
  };
  const _co = completeOnboarding;
  completeOnboarding = function(){ POKET.identity.exists = true; _co(); };
  function resetFlows(){
    S.cardFundStage='select'; S.cardFundCents=0; S.cardFundRef=null; S.cardFundKeypadOpen=false;
    S.payoutStage='currency'; S.payoutCents=0; S.payoutRecipient=null;
    S.fundStage='select'; S.signupCodeSent=false; S.loginCodeSent=false; S.openDropdown=null;
    S.selectedTx=null; S.extDetailBack=null; S.extSubConfirm=null;
    if(!POKET.identity.consent) S.signupTermsAccepted=false;
    if(POKET.identity.tier < 1){ S.idType=null; S.idCapture={ front:{status:'idle',name:'',size:0,thumb:null,error:''}, back:{status:'idle',name:'',size:0,thumb:null,error:''} }; S.lv={ stage:'intro' }; }
    S.signupNotice=null;
  }
  function showModal(k){
    if(POKET.checkout) POKET.checkout.suspend();
    POKET.walletMode = 'modal'; kind = k;
    host.classList.add('as-modal'); host.classList.toggle('as-task', k==='task'); host.style.display = 'block';
    const panel = document.querySelector('.panel'); if(panel) panel.style.display = '';
  }
  function openTask(screen, cb){
    resetFlows(); onReturn = cb || null; showModal('task');
    _go(screen, 'home');
  }
  function openAccount(screen, opts){
    opts = opts || {};
    resetFlows(); onReturn = null; showModal('account');
    if(screen==='activity'){ _go('home','activity'); return; }
    if(screen==='tx-detail'){
      const rec = opts.record && S.txns.find(t=>t.reference===opts.record.reference);
      if(rec){ S.selectedTx = rec; _go('tx-detail','activity'); return; }
      _go('home','activity'); return;
    }
    if(screen==='sub-detail'){ S.extSub = opts.sub; _go('sub-detail','home'); return; }
    _go(screen || 'home', 'home');
  }
  function gate(amountUsd, ok){
    if(!S.simulateGeoBlock && evaluateLimit(amountUsd).ok){ ok(); return; }
    resetFlows(); onReturn = null; S.screen = 'home'; S.tab = 'home'; showModal('task');
    gateAmount(amountUsd, ()=>{ close(); ok(); });
  }
  function resetView(){
    resetFlows();
    S.screen = POKET.identity.exists ? 'home' : 'onboard-welcome'; S.tab = 'home';
    if(POKET.walletMode==='standalone') render();
  }
  function showStandalone(){
    POKET.walletMode = 'standalone'; kind = null;
    host.classList.remove('as-modal','as-task'); host.style.display = 'block';
    resetView(); render();
  }
  function onCheckoutRecord(r){
    const type = r._type_c;
    if(type==='debit') recordSpend(Math.abs(r.amt)/100);
    logComplianceEvent('transaction:' + (type==='debit' ? 'merchant_payment' : type),
      Object.assign({ tierLimitCheck:'passed', geoCheck:'passed' }, type==='funding' ? { fundingRail:'GOAT', fundingTag:'FIAT_ONLY' } : {}),
      { title:r.title, amount:r.amount, positive:r.positive, context:r.context });
  }
  const head = document.getElementById('panelActions') || document.querySelector('.panel-head');
  const x = document.createElement('button');
  x.className = 'modal-close'; x.id = 'modalClose'; x.setAttribute('aria-label','Close');
  x.innerHTML = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
  x.onclick = () => { onReturn = null; close(); };
  head.appendChild(x);
  return { openTask, openAccount, gate, close, resetView, showStandalone, onCheckoutRecord, render: ()=>render(), get S(){ return S; }, get kind(){ return kind; } };
})();
