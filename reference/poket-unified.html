function extWhen(ts){
  const d = new Date(ts), now = new Date();
  const days = Math.floor((now - d)/86400000);
  const time = d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  if(days<1 && d.getDate()===now.getDate()) return time;
  if(days<7) return d.toLocaleDateString('en-US',{weekday:'short'}) + ', ' + time;
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

function cvType(f, to){

function vaCreate(){

function vaIncoming(kind){
  const cur=S.va.cur, spec=VA_SPEC[cur], va=vaOf(cur);
  const own = kind==='own';
  const [sender, bank] = own ? [vaHolderName(), (S.linkedBanks||[]).find(b=>b.currency===cur)?.bankName || 'Your bank'] : VA_SENDERS[Math.floor(Math.random()*VA_SENDERS.length)];
  const amt = own ? spec.sample.own : spec.sample.other;
  const returnedFrozen = va.status==='frozen' || S.vfDeclined;
  const outcome = returnedFrozen ? 'returned' : kind==='held' || kind==='returned' ? kind : 'completed';
  const ref = genRef();
  const tx = { type:'deposit', title:`Bank transfer from ${sender}`, sub:`Incoming \u00b7 ${spec.rails.split(' or ')[0]}`,
    amount:Math.round(amt*(fxToUSD[cur]||1)), amountText:`+${fmtCurrency(amt,cur)}`, positive:true, reference:ref, status:'pending',
    details:{ Currency:cur, From:`${sender} \u00b7 ${bank}`, Rail:spec.rails.split(' or ')[0], Sender: own ? 'You' : 'Someone else' } };
  addTx(tx);
  const added = S.txns[0];
  vfNotify(`Incoming ${fmtCurrency(amt,cur)} from ${sender}`, `${spec.rails.split(' or ')[0]} \u00b7 ${bank}`);
  render();
  setTimeout(()=>{
    if(outcome==='completed'){
      S.cashHoldings[cur] = (S.cashHoldings[cur]||0) + amt;
      added.status='completed'; added.sub = `${spec.rails.split(' or ')[0]} \u00b7 ${bank}`;
      vfNotify(`${fmtCurrency(amt,cur)} added to your ${cur} balance`, own ? 'From your own account. Ready to use or convert.' : `From ${sender}. Ready to use or convert.`);
    } else if(outcome==='held'){
      added.status='held'; added.sub = 'Held for review'; added.positive=false; added.amountText = fmtCurrency(amt,cur);
      vfNotify(`We're reviewing a ${fmtCurrency(amt,cur)} transfer`, `From ${sender}. We'll update you within 1 business day.`);
    } else {
      added.status='returned'; added.sub = returnedFrozen ? 'Returned \u00b7 account frozen' : 'Returned \u00b7 didn\'t pass our checks'; added.positive=false; added.amountText = fmtCurrency(amt,cur);
      vfNotify(`A ${fmtCurrency(amt,cur)} transfer was returned`, `It went back to ${sender}.`);
    }
    logComplianceEvent('virtual_account_deposit', { fundingTag:'OPEN', fundingRail:'bank_transfer', monitoring: outcome==='held'?'review':outcome==='returned'?'returned':'passed' },
      { reference:ref, currency:cur, amount:amt, sender, thirdParty:!own, outcome });
    render();
  }, 2200);
}

    return [{ label:'Skip ahead 45s', run:()=>{ if(S.vfPending){ S.vfPending.start = Date.now() - VF_SLOW_MS; S.vfPending.hinted = true; vfTick(); } } }];
  if(S.screen==='onboard-vf-slow' && p && p.outcome==='veriffReview')
    return [{ label:'Approve review', run:()=>{ if(S.vfPending) S.vfPending.outcome='pass'; vfResolve('approved'); } }];
  if(S.screen==='va' && S.va){

  : `<p class="step-sub">No other devices.</p>`}`;
}

/* ---------- merchant disputes (content carried over unchanged) ---------- */
function extDisputeReasons(){ return [
  'I was charged the wrong amount',
  'I was charged twice',
  'I never received the product or service',
  "The product or service wasn't as described",
  'I did not make this transaction',
  'I canceled a subscription that still renewed'
]; }
function extEvidenceLabel(r){ return ({
  'I was charged the wrong amount':'the wrong charge amount',
  'I was charged twice':'the duplicate charge',
  'I never received the product or service':'not receiving this',
  "The product or service wasn't as described":'the issue with your order',
  'I did not make this transaction':'not making this transaction',
  'I canceled a subscription that still renewed':'the canceled subscription'
})[r] || 'this issue'; }
function extDisputable(t){
  if(!t || t.dispute) return false;
  const c = t._type_c;
  /* Only purchases from a store can be disputed. Deposits and top-ups are the user's own money moving in. */
  return c==='debit';
}
function extWarnBox(title, body, tone){
  const t = tone==='err' ? 'background:var(--err-50);border:1px solid rgba(236,34,31,.2)' : 'background:var(--warn-50);border:1px solid var(--warn-200)';
  return `<div style="display:flex;gap:10px;padding:12px 14px;border-radius:var(--r-lg);${t};margin:4px 0 4px">
    <span style="flex:none;color:${tone==='err'?'var(--err-600)':'var(--warn-600)'}">${icons.alert}</span>
    <span style="font-size:12.5px;line-height:1.5;color:var(--n-800)"><b>${title}</b><br>${body}</span></div>`;
}
function extRadio(attr, val, label, sel){
  return `<div class="select-row ${sel?'sel':''}" ${attr}="${val}"><div class="meta"><div class="t1" style="font-weight:500">${label}</div></div><span class="radio"></span></div>`;
}
/* Dispute: two screens. 1) what's about to happen and what to have ready; 2) one form where only the reason
   is required. Follow-ups appear inline (contact date only if they contacted the merchant). */
function extDateLong(iso){ return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function extDateProblem(v, paidIso){
  const m=/^(\d{2}) \/ (\d{2}) \/ (\d{4})$/.exec(v||''); if(!m) return 'Enter the full date as MM / DD / YYYY.';
  const mo=+m[1], da=+m[2], yr=+m[3], dt=new Date(yr, mo-1, da);
  if(mo<1||mo>12||dt.getMonth()!==mo-1||dt.getDate()!==da) return 'That date doesn\u2019t exist. Check the month and day.';
  const paid=new Date(paidIso); paid.setHours(0,0,0,0); const today=new Date(); today.setHours(23,59,59,999);
  if(dt < paid) return `That\u2019s before you paid on ${extDateLong(paidIso)}.`;
  if(dt > today) return 'That date is in the future.';
  return null;
}
function tDispute(){
  const st = S.disputeStage, t = S.disputeTx || {};
  const back = (to, label) => `<button class="back-row" data-dback="${to}">${icons.back} ${label||'Back'}</button>`;
  const merchant = (t.details && t.details.Merchant) || t.name || 'the merchant';
  const row = (ic, title, sub) => `<div class="settings-row" style="cursor:default"><span class="settings-row-ic">${icons[ic]||icons.info}</span><div class="settings-row-text"><div class="settings-row-title">${title}</div><div class="settings-row-sub">${sub}</div></div></div>`;
  if(st==='start'){
    if((POKET.identity.disputeStrikes||0) >= 2) return `
      ${back('detail')}
      <div class="step-title">You can't raise a dispute right now</div>
      <p class="step-sub">Your account has been restricted from raising further disputes after repeated dispute activity that violated our terms of use.</p>
      ${extWarnBox('Account restricted','Contact support if you think this is a mistake.','err')}`;
    return `
      ${back('detail')}
      <div class="step-title">Dispute this payment?</div>
      <div class="info-card" style="margin:6px 0 12px"><div class="info-row"><span>${merchant}</span><span class="mono" style="font-weight:600">${fmt(Math.abs(t.amount||0))}</span></div><div class="info-row"><span>Date</span><span class="mono">${t.date ? extDateLong(t.date) : ''}</span></div></div>
      <div class="settings-list" style="margin-bottom:12px">
        ${row('calendar','Up to 14 days to resolve',`We review it with ${merchant} and update you by email.`)}
        ${row('card','Refunds go to your balance','If it\u2019s resolved in your favor. It may not be.')}
      </div>
      ${extWarnBox('False claims can close your account','Fraudulent disputes break our terms of use.')}
      <button class="btn-primary" data-dnext="form" style="margin-top:14px">Start dispute</button>
      <p style="font-size:12px;color:var(--txt2);text-align:center;margin:10px 0 0">Tip: have your receipt and any messages with the merchant ready.</p>`;
  }
  if(st==='form'){
    const dateBad = S.disputeContacted==='yes' && S.disputeContactDate && t.date ? extDateProblem(S.disputeContactDate, t.date) : null;
    const email = S.disputeContactEmail || POKET.identity.email;
    const SHORT = { 'I was charged the wrong amount':'Wrong amount', 'I was charged twice':'Charged twice', 'I never received the product or service':'Not received',
      "The product or service wasn't as described":'Not as described', 'I did not make this transaction':'Didn\u2019t make this payment', 'I canceled a subscription that still renewed':'Subscription renewed' };
    const isSub = (t.context||'').toLowerCase().includes('subscription');
    const reasons = extDisputeReasons().filter(r=> r!=='I canceled a subscription that still renewed' || isSub);
    const more = !!S.disputeMore;
    const n = (S.disputeContacted==='yes'?1:0)+(S.disputeEvidence?1:0)+(S.disputeDetails?1:0);
    return `
    <style>
      .ud-chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
      .ud-chips.odd .ud-chip:last-child{grid-column:1/-1}
      .ud-chip{height:40px;padding:0 10px;border:1px solid var(--n-300);border-radius:10px;background:var(--bg,#fff);font-size:13px;font-weight:600;font-family:inherit;color:var(--txt);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .ud-chip:hover{border-color:var(--n-400)}
      .ud-chip.on{background:var(--brand-50);border-color:var(--brand-500);color:var(--brand-600);box-shadow:0 2px 8px rgba(10,92,72,.1)}
      .ud-more{display:flex;align-items:center;gap:6px;width:100%;border:0;border-top:1px solid var(--bdr2);background:none;padding:12px 0 6px;font-family:inherit;font-size:13px;font-weight:600;color:var(--txt);cursor:pointer;text-align:left}
      .ud-more .o{font-weight:400;color:var(--txt3)}
      .ud-more .c{margin-left:auto;display:flex;color:var(--txt3);transform:rotate(${more?'-90':'90'}deg);transition:transform .15s}
      .ud-foot{border-top:1px solid var(--bdr2);margin-top:14px;padding-top:12px}
    </style>
    ${back('start')}
    <div class="step-title">Tell us what happened</div>
    <p class="step-sub">About your ${fmt(Math.abs(t.amount||0))} payment to ${merchant}.</p>
    <label class="field-label">Why are you disputing it?</label>
    <div class="ud-chips ${reasons.length%2?'odd':''}" role="radiogroup" aria-label="Reason">${reasons.map(r=>`<button type="button" class="ud-chip ${S.disputeReason===r?'on':''}" role="radio" aria-checked="${S.disputeReason===r}" data-dreason="${r.replace(/"/g,'&quot;')}" title="${r.replace(/"/g,'&quot;')}">${SHORT[r]}</button>`).join('')}</div>
    ${S.disputeReason==='I did not make this transaction' ? `<div class="info-card" style="font-size:12.5px;line-height:1.5;margin:0 0 12px">If you don\u2019t recognise this payment, also lock your card in the Card tab and contact Poket support so we can secure your account.</div>` : ''}
    <button type="button" class="ud-more" id="extDisputeMore" aria-expanded="${more}">Add more detail <span class="o">${!more && n ? n+' added' : 'Optional'}</span><span class="c"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
    ${more ? `
    <div class="select-row" style="cursor:default;margin-top:6px"><div class="meta"><div class="t1">I\u2019ve contacted ${merchant}</div></div>
      <button type="button" id="extDisputeContacted" role="switch" aria-checked="${S.disputeContacted==='yes'}" aria-label="I\u2019ve contacted ${merchant}" style="position:relative;width:40px;height:24px;border:0;padding:0;border-radius:999px;background:${S.disputeContacted==='yes'?'var(--brand-500)':'var(--n-300)'};flex:none;cursor:pointer;transition:background .15s ease"><span style="position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transform:translateX(${S.disputeContacted==='yes'?16:0}px);transition:transform .15s ease"></span></button></div>
    ${S.disputeContacted==='yes' ? `
    <label class="field-label">When did you last contact them?</label>
    <input class="field-input mono" id="extDisputeDate" placeholder="MM / DD / YYYY" inputmode="numeric" maxlength="14" value="${S.disputeContactDate||''}" aria-describedby="extDisputeDateMsg" style="${dateBad?'border-color:var(--err-600)':''}">
    <p id="extDisputeDateMsg" style="font-size:11.5px;margin:6px 0 12px;color:${dateBad?'var(--err-600)':'var(--txt3)'}">${dateBad || (t.date ? `Between ${extDateLong(t.date)} (when you paid) and today.` : '')}</p>` : ''}
    <label class="field-label" style="margin-bottom:2px">Evidence${S.disputeReason ? ' of '+extEvidenceLabel(S.disputeReason) : ''}</label>
    <p style="font-size:12px;line-height:1.5;color:var(--txt2);margin:0 0 8px">Attach any of these: messages with ${merchant}, your receipt or order confirmation, the product listing or photos.</p>
    <div class="select-row ${S.disputeEvidence?'sel':''}" id="extAttach"><span class="settings-row-ic" style="width:30px;height:30px">${icons.copy||icons.add}</span><div class="meta"><div class="t1">${S.disputeEvidence?'evidence.pdf attached':'Attach a file'}</div><div class="t2">${S.disputeEvidence?'Tap to remove':'PDF or image'}</div></div></div>
    <label class="field-label" for="extDisputeDetails" style="margin-top:6px">Anything else?</label>
    <textarea class="field-input" id="extDisputeDetails" rows="3" style="height:auto;resize:vertical;font-family:inherit;font-size:13.5px">${S.disputeDetails||''}</textarea>` : ''}
    ${S.disputeEditContact ? `<input class="field-input" id="extDisputeEmail" type="email" value="${email}" aria-label="Email for updates" style="margin-top:12px">` : ''}
    <div class="ud-foot">
      <p style="font-size:12.5px;color:var(--txt2);margin:0 0 10px">We\u2019ll email updates to <b>${email}</b> \u00b7 <button class="btn-ghost" id="extDisputeChange" style="font-size:12.5px">${S.disputeEditContact?'Done':'Change'}</button></p>
      <button class="btn-primary" id="extSubmitDispute" ${S.disputeReason && !dateBad ? '' : 'disabled'}>${S.disputeReason ? 'Submit dispute' : 'Choose a reason to continue'}</button>
    </div>`;
  }
  if(st==='submitting') return `<div class="center-col" style="padding-top:50px">
      <div class="sending-dots"><span></span><span></span><span></span></div>
      <div class="step-title" style="margin-top:18px">Submitting dispute&hellip;</div>
      <p class="step-sub">Sending your details for review.</p></div>`;
  return `<div class="center-col" style="padding-top:30px">
      <div class="check-circle">${CHECK_DRAW_U}</div>
      <div class="step-title">Dispute submitted</div>
      <p class="step-sub">If resolved in your favor, funds return to your balance.</p>
    </div>
    <button class="btn-primary" id="extDisputeDone" style="margin-top:18px">Back to activity</button>`;
}

function bindExtras(){
  const $ = id => document.getElementById(id);
  const P = window.POKET;
  if(!P) return;
  /* Create account: country, email/phone switch, edit */
  if($('signupCountrySelect')) $('signupCountrySelect').onchange = e=>{ S.country = e.target.value; if(!S.phoneCountry){ S.phoneCode = dialCodeFor(S.country); if(S.signupMethod==='phone') render(); } };
  if($('signupDialSelect')) $('signupDialSelect').onchange = e=>{ S.phoneCountry = e.target.value; S.phoneCode = dialCodeFor(S.phoneCountry); render(); const f=$('signupPhoneInput'); if(f) f.focus(); };
  if($('signupSwitchMethod')) $('signupSwitchMethod').onclick = ()=>{
    S.signupMethod = S.signupMethod==='phone' ? 'email' : 'phone';
    S.phoneCode = dialCodeFor(S.phoneCountry || S.country);
    if(S.signupCodeSent){ S.signupCodeSent = false; stopResendTimer(); }
    render();
    const f = $(S.signupMethod==='phone' ? 'signupPhoneInput' : 'signupEmailInput'); if(f) f.focus();
  };
  if($('signupEditIdentifier')) $('signupEditIdentifier').onclick = ()=>{
    S.signupCodeSent = false; stopResendTimer(); render();
    const f = $(S.signupMethod==='phone' ? 'signupPhoneInput' : 'signupEmailInput'); if(f){ f.focus(); f.select(); }
  };
  /* header bell */
  const bell = $('openNotifHeader');
  if(bell){
    const pre = S.screen.startsWith('onboard') || ['onboard-geo-blocked','age-blocked','doc-age-blocked','sanctions-declined','login-geo','login-geo-blocked'].includes(S.screen);
    bell.style.display = (P.identity.exists && !pre) ? '' : 'none';
    const gear = $('openSettingsHeader'); if(gear) gear.style.display = pre ? 'none' : '';
    const unread = (P.identity.notifications||[]).filter(n=>!n.read).length;
    const dot = $('notifDot'); if(dot) dot.style.display = unread ? 'block' : 'none';
    bell.classList.toggle('has-unread', !!unread);
    bell.onclick = ()=>go('notifications', S.tab||'home');
  }
  if($('onboardGeoBlockedClose')) $('onboardGeoBlockedClose').onclick = ()=>{
    S.dobMonth=''; S.dobDay=''; S.dobYear=''; S.ageConfirmed=false; S.signupCodeSent=false;
    go('onboard-welcome');
  };
  /* KYC */
  if(S.screen!=='onboard-liveness-check') kycStopLiveness();
  if(S.screen==='onboard-kyc-start' && !S.kycGeoTimer){
    S.kycGeoTimer = setTimeout(()=>{
      S.kycGeoTimer = null;
      if(S.screen!=='onboard-kyc-start') return;
      if(S.simulateGeoBlock){ S.geoVerified=false; logComplianceEvent('kyc_step', {geoCheck:'blocked'}, {outcome:'declined', stage:'onboarding'}); go('onboard-geo-blocked'); return; }
      S.geoVerified = true; logComplianceEvent('kyc_step', {geoCheck:'passed'}, {stage:'onboarding'});
      go('onboard-details');
    }, 1100);
  }
  if(S.screen==='onboard-details'){
    const ready = ()=>{ const b=$('kycDetailsContinue'); if(b) b.disabled = !kycDetailsReady(); };
    ready();   // ID capture and the ID type picker re-render this screen; keep the button in step
    if($('kycFirst')) $('kycFirst').oninput = e=>{ S.firstName = e.target.value.trimStart(); ready(); };
    if($('kycLast')) $('kycLast').oninput = e=>{ S.lastName = e.target.value.trimStart(); ready(); };
    if($('kycDobM')) $('kycDobM').onchange = e=>{ S.dobMonth = e.target.value; e.target.classList.toggle('is-placeholder', !e.target.value);
      [...e.target.options].forEach((o,i)=>{ if(i>0) o.textContent = o.selected ? KYC_MONTHS[i-1].slice(0,3) : KYC_MONTHS[i-1]; }); ready(); };
    if($('kycDobD')) $('kycDobD').oninput = e=>{ e.target.value = kycNum(e.target.value,2); if(+e.target.value>31) e.target.value='31'; S.dobDay = e.target.value; ready(); };
    if($('kycDobY')) $('kycDobY').oninput = e=>{
      let v = kycNum(e.target.value,4); const y = new Date().getFullYear();
      if(v.length===4){ if(+v>y) v=String(y); else if(+v<y-120) v=String(y-120); }
      e.target.value = v; S.dobYear = v; ready();
    };
    if($('kycAgeConfirm')) $('kycAgeConfirm').onchange = e=>{ S.ageConfirmed = e.target.checked; ready(); };
    if($('kycDetailsContinue')) $('kycDetailsContinue').onclick = e=>{
      if(!kycDetailsReady()) return;
      S.firstName = S.firstName.trim(); S.lastName = S.lastName.trim();
      S.legalName = `${S.firstName} ${S.lastName}`;
      withSpinner(e.currentTarget, 600, ()=>{
        const age = ageFromDob(parseInt(S.dobYear,10), parseInt(S.dobMonth,10), parseInt(S.dobDay,10));
        if(!(age >= MIN_AGE) || POKET.signupOutcome==='under18'){
          logComplianceEvent('kyc_step', { ageCheck:'failed_self_attested' }, { outcome:'declined' });
          go('age-blocked'); return;
        }
        logComplianceEvent('kyc_step', { ageCheck:'passed_self_attested' }, { stage:'details' });
        if(kycUsesSsn() && !S.noSsn){
          S.ssnOnFile = true; S.vfStarted = true; S.kycVendor = 'plaid';
          logComplianceEvent('kyc_step', { vendor:'Plaid', ssn:'provided', dataCheck:'submitted' }, { stage:'id_verification', route:'us_ssn' });
          S.vfh = { stage:'start', vendor:'plaid', phone: S.signupMethod==='phone' ? (S.phone||'') : '' };
          go('onboard-vf-handoff');
        }
        else { S.kycVendor = 'veriff'; S.vf = { stage:'intro' }; go('onboard-veriff'); }
      });
    };
  }
  if($('vfBack')) $('vfBack').onclick = ()=>go('onboard-details');
  if($('vfStart')) $('vfStart').onclick = e=>withSpinner(e.currentTarget, 500, ()=>{ S.vfStarted = true; S.kycVendor = 'veriff'; S.vfh = { stage:'start', vendor:'veriff', phone: S.signupMethod==='phone' ? (S.phone||'') : '' }; logComplianceEvent('kyc_step', { vendor:'Veriff', session:'started' }, { stage:'id_verification' }); go('onboard-vf-handoff'); });
  if(S.screen==='onboard-details' || S.screen==='onboard-ssn'){
    if($('ssnInput')) $('ssnInput').oninput = e=>{
      let d = e.target.value.replace(/\D/g,'').slice(0,9);
      S.ssn = d.length>5 ? d.slice(0,3)+'-'+d.slice(3,5)+'-'+d.slice(5) : d.length>3 ? d.slice(0,3)+'-'+d.slice(3) : d;
      e.target.value = S.ssn;
      const b=$('kycDetailsContinue'); if(b) b.disabled = !kycDetailsReady();
      const showErr = ssnDigits().length===9 && !ssnValid();
      if(showErr !== !!document.querySelector('#panelBody .field-err')){ render(); const f=$('ssnInput'); if(f){ f.focus(); f.setSelectionRange(f.value.length,f.value.length); } }
    };
    if($('ssnToggle')) $('ssnToggle').onclick = ()=>{ S.ssnVisible = !S.ssnVisible; render(); const f=$('ssnInput'); if(f){ f.focus(); f.setSelectionRange(f.value.length,f.value.length); } };
    if($('ssnNone')) $('ssnNone').onclick = ()=>{ S.noSsn = true; logComplianceEvent('kyc_step', { ssn:'not_available' }, { route:'veriff' }); render(); };
    if($('ssnHave')) $('ssnHave').onclick = ()=>{ S.noSsn = false; render(); const f=$('ssnInput'); if(f) f.focus(); };
  }
  if(S.screen==='onboard-vf-handoff' && S.vfh){
    const h=S.vfh;
    if($('vfhPhone')) $('vfhPhone').oninput = e=>{ h.phone = e.target.value; const b=$('vfhSend'); if(b) b.disabled = h.phone.replace(/\D/g,'').length < 7; };
    if($('vfhSend')) $('vfhSend').onclick = e=>withSpinner(e.currentTarget, 600, ()=>{ h.stage='sent'; render(); });
    if($('vfhResend')) $('vfhResend').onclick = ()=>{ h.stage='start'; render(); };
    if($('vfhRestart')) $('vfhRestart').onclick = ()=>{ h.stage='start'; render(); };
    if($('vfhClose')) $('vfhClose').onclick = ()=>{ S.vfStarted = true; S.vf={stage:'intro'}; logComplianceEvent('kyc_step', { vendor:'Veriff', session:'abandoned' }, { stage:'id_verification' }); go('onboard-veriff'); };
  }
  if($('vfIdBack')) $('vfIdBack').onclick = ()=>{ S.vf={stage:'intro'}; go('onboard-veriff'); };
  if($('vfIdContinue')) $('vfIdContinue').onclick = e=>withSpinner(e.currentTarget, 400, ()=>{ S.lv={stage:'intro'}; go('onboard-liveness-check'); });
  if($('vfCancel')) $('vfCancel').onclick = ()=>{ S.vfStarted = true; S.vf={stage:'intro'}; logComplianceEvent('kyc_step', { vendor:'Veriff', session:'abandoned' }, { stage:'id_verification' }); render(); };
  if($('vfComplete')) $('vfComplete').onclick = ()=>{ S.idCaptured = true; S.livenessDone = true; S.vf=null; if(vfCanPayWhilePending()) vfStartNonBlocking(); else vfStartWait(); };
  if($('vfSkipAhead')) $('vfSkipAhead').onclick = ()=>{ if(S.vfPending){ S.vfPending.start = Date.now() - VF_SLOW_MS; S.vfPending.hinted = true; vfTick(); } };
  if($('vfReviewApprove')) $('vfReviewApprove').onclick = ()=>{ if(S.vfPending) S.vfPending.outcome = 'pass'; vfResolve('approved'); };
  if($('vfFinishLater')) $('vfFinishLater').onclick = ()=>go('home','home');
  if($('vfTryAgain')) $('vfTryAgain').onclick = ()=>{ S.vfh = { stage:'start', vendor:S.kycVendor||'veriff', phone: S.signupMethod==='phone' ? (S.phone||'') : '' }; go('onboard-vf-handoff'); };
  if($('vfDeclinedDone')) $('vfDeclinedDone').onclick = ()=>go('home','home');
  /* wallet home while verification is pending or declined */
  if(S.screen==='home' && (S.vfPending || S.vfDeclined)){
    const body = $('panelBody');
    if(body && !body.querySelector('.vf-banner')){
      const d = document.createElement('div');
      d.className = 'vf-banner' + (S.vfDeclined ? ' err' : '');
      d.innerHTML = S.vfDeclined
        ? `<b>We couldn't verify your identity.</b> Contact Poket support if you think this is a mistake.`
        : `<b>Verification in progress.</b> We'll email ${vfMaskedContact()} when it's done. Money can't move until then.`;
      body.prepend(d);
    }
  }
  if($('kycBackToDetails')) $('kycBackToDetails').onclick = ()=>{ kycStopLiveness(); S.lv = { stage:'intro' }; go('onboard-vf-id'); };
  if($('kycStartLiveness')) $('kycStartLiveness').onclick = ()=>kycRunLiveness();
  if($('kycCancelLiveness')) $('kycCancelLiveness').onclick = ()=>{ kycStopLiveness(); S.lv = { stage:'intro' }; render(); };
  if($('kycCancel')) $('kycCancel').onclick = ()=>{ S.kycGeoTimer && clearTimeout(S.kycGeoTimer); S.kycGeoTimer=null; go('home','home'); };
  /* Convert */
  if(S.screen!=='convert' || !S.cv || S.cv.stage!=='review') cvStopTimer();
  if(S.screen==='convert' && S.cv){
    const c=S.cv;
    if($('cvPickFrom')) $('cvPickFrom').onclick = ()=>{ c.search=''; c.stage='pickFrom'; render(); };
    if($('cvPickTo')) $('cvPickTo').onclick = ()=>{ c.search=''; c.stage='pickTo'; render(); };
    if($('cvPickBack')) $('cvPickBack').onclick = ()=>{ c.stage='form'; render(); };
    if($('cvSearch')) $('cvSearch').oninput = e=>{ c.search=e.target.value; const pos=e.target.selectionStart; render(); const s=$('cvSearch'); if(s){ s.focus(); s.setSelectionRange(pos,pos); } };
    document.querySelectorAll('[data-cvopt]').forEach(el=>el.onclick=()=>{
      if(el.getAttribute('aria-disabled')==='true') return;
      if(el.dataset.cvblocked){
        const f=cvParse(c.from), o=cvParse(el.dataset.cvopt);
        showNotice("Card-funded cash can't convert to stablecoins", 'Choose cash, or convert from a balance without the FIAT-ONLY tag.', 4000);
        logComplianceEvent('digital_asset_purchase_blocked', { fundingRail:'GOAT', fundingTag:'FIAT_ONLY', segregationCheck:'blocked' },
          { outcome:'blocked', stage:'convert_selection', asset:o.asset, network:o.net, currency:f.cur, fiatOnlyBalance:fiatOnlyAmt(f.cur), fundsMoved:false });
        return;
      }
      if(c.stage==='pickFrom'){ if(c.from!==el.dataset.cvopt){ c.from=el.dataset.cvopt; c.cents=0; cvFixTo(); } }
      else c.to=el.dataset.cvopt;
      c.stage='form'; render();
    });
    if($('cvFlip')) $('cvFlip').onclick = ()=>{
      const f=cvParse(c.from), to=cvParse(c.to);
      let nf = to; if(nf.k==='cash') nf.bucket = digitalEligibleAmt(nf.cur)>0 ? 'open' : (fiatOnlyAmt(nf.cur)>0 ? 'fiat' : 'open');
      const nt = f.k==='cash' ? {k:'cash',cur:f.cur,bucket:'open'} : f;
      c.from=cvKey(nf); c.to=cvKey(nt); c.cents=0; cvFixTo(); render();
    };
    document.querySelectorAll('[data-cvrateflip]').forEach(b=>b.onclick=()=>{ c.rateFlip=!c.rateFlip; render(); });
    if($('cvMax')) $('cvMax').onclick = ()=>{ c.cents = cvAvail(cvParse(c.from)); render(); };
    document.querySelectorAll('[data-cvkey]').forEach(b=>b.onclick=()=>{
      const k=b.dataset.cvkey; let s=String(c.cents||0);
      if(k==='back') s = s.length>1 ? s.slice(0,-1) : '0';
      else if(s.length<12) s = s==='0' ? k : s+k;
      c.cents=parseInt(s,10)||0; render();
    });
    if($('cvReview')) $('cvReview').onclick = e=>withSpinner(e.currentTarget, 400, ()=>{ cvNewQuote(); c.stage='review'; render(); });
    if($('cvBackToForm')) $('cvBackToForm').onclick = ()=>{ c.stage='form'; render(); };
    if($('cvRefresh')) $('cvRefresh').onclick = e=>withSpinner(e.currentTarget, 400, ()=>{ cvNewQuote(); render(); });
    if($('cvConfirm')) $('cvConfirm').onclick = e=>{
      const q=cvQuote();
      if(q.amt<=0 || q.amt>q.avail || cvBlockedPair(q.f,q.to)) return;
      const run = ()=>withSpinner(e.currentTarget, 400, ()=>{ cvStopTimer(); c.stage='processing'; render(); setTimeout(cvExecute, 1300); });
      if(cvCounts(q.type) || S.tier<1 || S.simulateGeoBlock) gateAmount(q.usd/100, ()=>{ go('convert'); run(); });
      else run();
    };
    if(c.stage==='review' && !c.expired && !S.cvTimer){
      S.cvTimer = setInterval(()=>{
        if(S.screen!=='convert' || !S.cv || S.cv.stage!=='review'){ cvStopTimer(); return; }
        const left = CV_QUOTE_SECONDS - Math.floor((Date.now()-S.cv.quoteAt)/1000);
        if(left<=0){ cvStopTimer(); S.cv.expired=true; render(); return; }
        const el=$('cvTimerLeft'); if(el) el.textContent = '0:'+String(left).padStart(2,'0');
      }, 1000);
    }
    if($('cvViewTx')) $('cvViewTx').onclick = ()=>{ if(S.txns[0]){ S.selectedTx=S.txns[0]; go('tx-detail'); } };
    if($('cvDone')) $('cvDone').onclick = ()=>{ S.cv=null; go('home','home'); };
  }
  if($('actConvert')) $('actConvert').onclick = ()=>cvStart();
  if($('detailConvert')) $('detailConvert').onclick = ()=>{
    const h=S.detailHolding; if(!h) return;
    if(h.asset) cvStart({ to:`coin:${h.asset}:${h.network}`, from:cvDefaultFrom() });
    else cvStart({ from:`cash:${h.currency}:${h.bucket||'open'}` });
  };
  if($('buyStablecoinCta')) $('buyStablecoinCta').onclick = ()=>cvStart({ to:'coin:USDC:Base' });
  /* Log in: same field pattern as sign-up */
  if($('loginSwitchMethod')) $('loginSwitchMethod').onclick = ()=>{
    S.loginMethod = S.loginMethod==='phone' ? 'email' : 'phone';
    S.loginPhoneCode = dialCodeFor(S.loginPhoneCountry || S.country);
    if(S.loginCodeSent){ S.loginCodeSent=false; stopResendTimer(); }
    render(); const f=$(S.loginMethod==='phone'?'loginPhoneInput':'loginEmailInput'); if(f) f.focus();
  };
  if($('loginDialSelect')) $('loginDialSelect').onchange = e=>{ S.loginPhoneCountry = e.target.value; S.loginPhoneCode = dialCodeFor(e.target.value); render(); const f=$('loginPhoneInput'); if(f) f.focus(); };
  if($('loginEditIdentifier')) $('loginEditIdentifier').onclick = ()=>{ S.loginCodeSent=false; stopResendTimer(); render(); const f=$(S.loginMethod==='phone'?'loginPhoneInput':'loginEmailInput'); if(f) f.focus(); };
  if($('settingsLogOut')) $('settingsLogOut').onclick = ()=>{
    S.loginMethod = S.signupMethod==='phone' ? 'phone' : 'email';
    S.loginEmail = S.email || POKET.identity.email || ''; S.loginPhone = S.phone || '';
    S.loginCodeSent = false; S.geoVerified = false;
    logComplianceEvent('logout', {}, { outcome:'success' });
    go('onboard-login');
  };
  /* Virtual accounts */
  document.querySelectorAll('#vaOpen').forEach(el=>{ const go2=()=>vaOpen(el.dataset.vacur, 'holding-detail'); el.onclick=go2; el.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go2(); } }; });
  if($('dmBank')) $('dmBank').onclick = ()=>vaOpen(S.depositCurrency, 'deposit-method');
  if($('dmCard')) $('dmCard').onclick = ()=>{ S.cardFundCents=0; S.cardFundKeypadOpen=false; S.cardFundStage='amount'; go('card-fund'); };
  if(S.screen==='deposit-method' && $('backToDepositSelect')) $('backToDepositSelect').onclick = ()=>{ if(S.dmBack){ const back=S.dmBack; S.dmBack=null; go(back); return; } S.cardFundStage='select'; go('card-fund'); };
  if(S.screen==='va' && S.va){
    const v=S.va;
    if($('vaBack')) $('vaBack').onclick = ()=>{ if(v.confirmClose){ v.confirmClose=false; render(); return; } go(v.back==='va'?'home':v.back); };
    if($('vaVerify')) $('vaVerify').onclick = ()=>go('onboard-kyc-start');
    if($('vaTaxId')) $('vaTaxId').oninput = e=>{ let d=e.target.value.replace(/\D/g,'').slice(0,9); e.target.value = d.length>5 ? d.slice(0,3)+'-'+d.slice(3,5)+'-'+d.slice(5) : d.length>3 ? d.slice(0,3)+'-'+d.slice(3) : d; v.taxId=e.target.value; const b=$('vaCreate'); if(b) b.disabled=!vaIntroReady(); };
    if($('vaAgree')) $('vaAgree').onchange = e=>{ v.agree=e.target.checked; const b=$('vaCreate'); if(b) b.disabled=!vaIntroReady(); };
    if($('vaCreate')) $('vaCreate').onclick = ()=>vaCreate();
    if($('vaProtoApprove')) $('vaProtoApprove').onclick = ()=>{ vaOf(v.cur).status='ready'; logComplianceEvent('virtual_account', {partnerBank:VA_SPEC[v.cur].bank}, {action:'approved', currency:v.cur}); vfNotify(`Your ${v.cur} account details are ready`, `Share them to receive ${v.cur}.`); render(); };
    if($('vaProtoReject')) $('vaProtoReject').onclick = ()=>{ vaOf(v.cur).status='rejected'; logComplianceEvent('virtual_account', {partnerBank:VA_SPEC[v.cur].bank}, {action:'declined', currency:v.cur}); vfNotify(`We couldn't open your ${v.cur} account`, 'You can still deposit by card.'); render(); };
    if($('vaUseCard')) $('vaUseCard').onclick = ()=>{ S.depositType='cash'; S.depositCurrency=v.cur; S.cardFundCents=0; S.cardFundKeypadOpen=false; S.cardFundStage='amount'; go('card-fund'); };
    document.querySelectorAll('[data-vacopy]').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.vacopy, va=vaOf(v.cur); const fields=[['Account name', vaHolderName()]].concat(VA_SPEC[v.cur].fields(va.num));
      try{ navigator.clipboard && navigator.clipboard.writeText(fields[i][1]).catch(()=>{}); }catch(e){}
      v.copied=i; render(); setTimeout(()=>{ if(S.va && S.va.copied===i){ S.va.copied=null; render(); } }, 1500);
    });
    if($('vaShare')) $('vaShare').onclick = ()=>{
      const va=vaOf(v.cur); const text=[['Account name', vaHolderName()]].concat(VA_SPEC[v.cur].fields(va.num)).map(([k,x])=>`${k}: ${x}`).join('\n');
      if(navigator.share){ navigator.share({ title:`My ${v.cur} account details`, text }).catch(()=>{}); }
      else { try{ navigator.clipboard.writeText(text).catch(()=>{}); }catch(e){} showNotice('Details copied', 'Paste them into a message or email.', 2400); }
    };
    if($('vaLetter')) $('vaLetter').onclick = ()=>vaLetter();
    if($('vaFreeze')) $('vaFreeze').onclick = ()=>{ const va=vaOf(v.cur); va.status = va.status==='frozen' ? 'ready' : 'frozen'; logComplianceEvent('virtual_account', {}, { action: va.status==='frozen'?'frozen':'unfrozen', currency:v.cur }); render(); };
    if($('vaClose')) $('vaClose').onclick = ()=>{ v.confirmClose=true; render(); };
    if($('vaCloseCancel')) $('vaCloseCancel').onclick = ()=>{ v.confirmClose=false; render(); };
    if($('vaCloseConfirm')) $('vaCloseConfirm').onclick = ()=>{ delete vaStore()[v.cur]; logComplianceEvent('virtual_account', {}, { action:'closed', currency:v.cur }); showNotice(`${v.cur} account details closed`, 'Your balance is still in your wallet.', 2600); go(v.back==='va'?'home':v.back); };
    document.querySelectorAll('[data-vasim]').forEach(b=>b.onclick=()=>vaIncoming(b.dataset.vasim));
  }
  if(POKET.setProtoActions) POKET.setProtoActions(protoActionsFor());
  /* a declined sign-up leaves no usable account behind */
  ['ageBlockedClose','docAgeBlockedClose','sanctionsDeclinedClose','onboardGeoBlockedClose'].forEach(id=>{
    const el = $(id); if(el) el.addEventListener('click', ()=>{ P.identity.exists = false; P.session.recognized = false; P.identity.tier = 0; }, { capture:true });
  });
  /* settings rows */
  if($('openMethods')) $('openMethods').onclick = ()=>go('methods');
  if($('openSubscriptions')) $('openSubscriptions').onclick = ()=>go('subscriptions');
  if($('openSecurity')) $('openSecurity').onclick = ()=>go('security');
  if($('extBackHome')) $('extBackHome').onclick = ()=>go('home', S.tab||'home');
  document.querySelectorAll('#extBackSettings').forEach(el=>el.onclick = ()=>go('settings'));
  if($('extBackSubs')) $('extBackSubs').onclick = ()=>{ S.extSubConfirm=null; go('subscriptions'); };
  /* notifications */
  document.querySelectorAll('[data-notif]').forEach(el=>el.onclick = ()=>{
    const n = (P.identity.notifications||[]).find(x=>x.id===el.dataset.notif);
    if(!n) return;
    n.read = true;
    const a = n.action || {};
    if(a.txnId){
      const t = S.txns.find(x=>String(x.id)===String(a.txnId));
      if(t){ S.selectedTx = t; S.extDetailBack = 'notifications'; go('tx-detail'); return; }
    }
    if(a.screen==='settings'){ go('security'); return; }
    render();
  });
  /* methods */
  document.querySelectorAll('[data-removecard]').forEach(el=>el.onclick = ()=>{
    P.replaceCards(P.account.cards.filter(c=>c.id!==el.dataset.removecard));
    const rel = P.relationships['ile-living'];
    if(rel.defaultMethod && rel.defaultMethod.id===el.dataset.removecard) rel.defaultMethod = null;
    render();
  });
  /* subscriptions */
  document.querySelectorAll('[data-sub]').forEach(el=>el.onclick = ()=>{ S.extSub = el.dataset.sub; S.extSubConfirm=null; go('sub-detail'); });
  if($('extSubCancel')) $('extSubCancel').onclick = ()=>{ S.extSubConfirm = S.extSub; render(); };
  if($('extSubCancelNo')) $('extSubCancelNo').onclick = ()=>{ S.extSubConfirm = null; render(); };
  if($('extSubCancelYes')) $('extSubCancelYes').onclick = ()=>{
    const s = P.subscriptions().find(x=>x.id===S.extSub);
    if(s){ s.status='cancelled'; s.endDate = s.nextDate || Date.now(); s.nextDate = null; }
    S.extSubConfirm = null; render();
  };
  /* security */
  document.querySelectorAll('[data-channel]').forEach(el=>el.onclick = ()=>{
    if(el.dataset.channel==='text' && !P.identity.phone) return;
    P.identity.channel = el.dataset.channel; render();
  });
  document.querySelectorAll('[data-signout]').forEach(el=>el.onclick = ()=>{
    P.identity.devices = (P.identity.devices||[]).filter(d=>d.id!==el.dataset.signout); render();
  });
  /* disputes */
  if(S.screen==='tx-detail'){
    const t = S.selectedTx;
    const card = document.querySelector('#panelBody .info-card');
    if(t && t.dispute && card && !card.querySelector('[data-disputerow]')){
      card.insertAdjacentHTML('beforeend', `<div class="info-row" data-disputerow><span>Dispute</span><span>${extChip('Open \u00b7 under review','err')}</span></div>`);
    }
    if(t && extDisputable(t) && !$('extRaiseDispute')){
      const body = $('panelBody');
      body.insertAdjacentHTML('beforeend', `<button class="btn-secondary" id="extRaiseDispute" style="width:100%;margin-top:14px">Raise a dispute</button>`);
    }
    if($('extRaiseDispute')) $('extRaiseDispute').onclick = ()=>{
      Object.assign(S, { disputeTx:S.selectedTx, disputeStage:'start', disputeReason:null, disputeContacted:'no', disputeContactDate:'', disputeEvidence:false, disputeDetails:'', disputeContactEmail:'', disputeEditContact:false, disputeMore:false });
      go('dispute');
    };
    if(S.extDetailBack==='notifications' && $('backFromTxDetail')) $('backFromTxDetail').onclick = ()=>{ S.extDetailBack=null; go('notifications'); };
  }
  if(S.screen==='dispute'){
    const keep = ()=>{ const det=$('extDisputeDetails'); if(det) S.disputeDetails = det.value; const em=$('extDisputeEmail'); if(em) S.disputeContactEmail = em.value.trim(); };
    document.querySelectorAll('[data-dback]').forEach(el=>el.onclick = ()=>{
      if(el.dataset.dback==='detail'){ S.selectedTx = S.disputeTx; go('tx-detail'); return; }
      keep(); S.disputeStage = el.dataset.dback; render();
    });
    document.querySelectorAll('[data-dnext]').forEach(el=>el.onclick = ()=>{ S.disputeStage = el.dataset.dnext; render(); });
    document.querySelectorAll('[data-dreason]').forEach(el=>el.onclick = ()=>{ keep(); S.disputeReason = el.dataset.dreason; render(); });
    if($('extDisputeContacted')) $('extDisputeContacted').onclick = ()=>{ keep(); S.disputeContacted = S.disputeContacted==='yes' ? 'no' : 'yes'; render(); const f=$('extDisputeDate'); if(f) f.focus(); };
    if($('extAttach')) $('extAttach').onclick = ()=>{ keep(); S.disputeEvidence = !S.disputeEvidence; render(); };
    if($('extDisputeDetails')) $('extDisputeDetails').oninput = e=>{ S.disputeDetails = e.target.value; };
    if($('extDisputeEmail')) $('extDisputeEmail').oninput = e=>{ S.disputeContactEmail = e.target.value.trim(); };
    if($('extDisputeMore')) $('extDisputeMore').onclick = ()=>{ keep(); S.disputeMore = !S.disputeMore; render(); };
    if($('extDisputeChange')) $('extDisputeChange').onclick = ()=>{ keep(); S.disputeEditContact = !S.disputeEditContact; render(); const em=$('extDisputeEmail'); if(em) em.focus(); };
    if($('extDisputeDate')) $('extDisputeDate').oninput = e=>{
      const v=e.target.value.replace(/\D/g,'').slice(0,8); e.target.value = v.length>4 ? v.slice(0,2)+' / '+v.slice(2,4)+' / '+v.slice(4) : v.length>2 ? v.slice(0,2)+' / '+v.slice(2) : v;
      S.disputeContactDate = e.target.value;
      const t = S.disputeTx, problem = (t && t.date && S.disputeContactDate) ? extDateProblem(S.disputeContactDate, t.date) : null, complete = v.length===8, msg=$('extDisputeDateMsg');
      msg.style.color = problem&&complete ? 'var(--err-600)' : 'var(--txt3)'; msg.textContent = problem&&complete ? problem : `Between ${extDateLong(t.date)} (when you paid) and today.`;
      e.target.style.borderColor = problem&&complete ? 'var(--err-600)' : ''; e.target.setAttribute('aria-invalid', problem&&complete?'true':'false');
      $('extSubmitDispute').disabled = !S.disputeReason || (!!S.disputeContactDate && !!problem);
    };
    if($('extSubmitDispute')) $('extSubmitDispute').onclick = ()=>{
      keep(); S.disputeStage = 'submitting'; render();
      setTimeout(()=>{
        const t = S.disputeTx; if(t) t.dispute = 'open';
        P.identity.disputeStrikes = Math.min((P.identity.disputeStrikes||0)+1, 2);
        logComplianceEvent('dispute:opened', { strikeCount:P.identity.disputeStrikes }, { reason:S.disputeReason, contactedMerchant:S.disputeContacted==='yes', evidence:!!S.disputeEvidence, reference:t?t.reference:null, context:t?t.context:null });
        S.disputeStage = 'done'; render();
      }, 1300);
    };
    if($('extDisputeDone')) $('extDisputeDone').onclick = ()=>go('home','activity');
  }
}


/* Sessions opened from the merchant checkout carry the store's customer details. */
(function(){
  const W = POKET.wallet, _ot = W.openTask, _ss = W.showStandalone;
  W.openTask = function(screen, cb){
    S.fromMerchant = true; S._mpEmailDone = false; S._mpNamesDone = false; S._mpLoginDone = false;
    if(screen==='onboard-kyc-start' || screen==='onboard-details'){
      if(S.vfDeclined) screen = 'onboard-vf-declined';
      else if(!S.vfPending && S.vfRetryReason && S.tier<1) screen = 'onboard-vf-retry';
      else if(S.vfPending) screen = (Date.now()-S.vfPending.start >= VF_SLOW_MS || ['veriffSlow','veriffReview'].includes(S.vfPending.outcome)) ? 'onboard-vf-slow' : 'onboard-vf-wait';
      else if(S.vfStarted && S.kycVendor==='plaid'){ screen = 'onboard-details'; }
      else if(S.vfStarted){ S.vf = {stage:'intro'}; screen = 'onboard-veriff'; }
    }
    return _ot.call(this, screen, cb);
  };
  const _setSc = POKET.setScenario;
  POKET.setScenario = function(){ vfStopTicker(); S.noSsn=false; S.ssn=''; S.ssnOnFile=false; S.ssnVisible=false; S.kycVendor=null; S.virtualAccounts={}; S.va=null; S.vfPending=null; POKET.identity.provisional=null; S.vfDeclined=false; S.vfStarted=false; S.vfAttempts=0; S.vfRetryReason=null; const _r = _setSc.apply(this, arguments); S.simulateGeoBlock = POKET.location==='blocked'; return _r; };
  W.showStandalone = function(){ S.fromMerchant = false; return _ss.apply(this, arguments); };
})();

<script>
(function(){
  const checkoutHost = document.getElementById('checkoutHost');
  const walletHost = document.getElementById('walletHost');
  const btns = document.querySelectorAll('.proto-bar .seg button');
  function setSurface(s){
    POKET.surface = s;
    btns.forEach(b => b.classList.toggle('on', b.dataset.surface===s));
    if(s==='wallet'){
      if(POKET.walletMode==='modal') POKET.wallet.close();
      POKET.checkout.closeWidget();
      checkoutHost.style.display = 'none';
      POKET.wallet.showStandalone();
    } else {
      POKET.merchants['ile-living'].exposure = (s==='checkout-only') ? 'checkout' : 'account';
      walletHost.style.display = 'none'; walletHost.classList.remove('as-modal','as-task');
      POKET.walletMode = 'hidden'; if(POKET.setProtoActions) POKET.setProtoActions([]);
      checkoutHost.style.display = 'block';
      POKET.checkout.refresh();
    }
  }
  btns.forEach(b => b.addEventListener('click', () => setSurface(b.dataset.surface)));
  POKET.setSurface = setSurface;
  const p = new URLSearchParams(location.search);
  /* Customer (scenario) and sign-up outcome: global controls */
  const scSel = document.getElementById('protoScenario'), ocSel = document.getElementById('protoOutcome');
  const groups = {};
  Object.entries(POKET.SCENARIOS).forEach(([k,v])=>{ (groups[v.group] = groups[v.group] || []).push(`<option value="${k}" title="${v.desc}">${v.label}</option>`); });
  scSel.innerHTML = Object.entries(groups).map(([g,opts])=>`<optgroup label="${g}">${opts.join('')}</optgroup>`).join('');
  ocSel.innerHTML = Object.entries(POKET.SIGNUP_OUTCOMES).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('');
  scSel.value = POKET.scenario; scSel.title = POKET.SCENARIOS[POKET.scenario].desc;
  scSel.onchange = ()=>{ POKET.setScenario(scSel.value); scSel.title = POKET.SCENARIOS[scSel.value].desc; if(POKET.surface==='wallet') POKET.wallet.showStandalone(); };
  const oc = p.get('outcome'); if(oc && POKET.SIGNUP_OUTCOMES[oc]) POKET.signupOutcome = oc;
  ocSel.value = POKET.signupOutcome;
  ocSel.onchange = ()=>{ POKET.signupOutcome = ocSel.value; };
  /* Location: drives the geo check at sign-up, log in and every transaction */
  const locSel = document.getElementById('protoLocation');
  const setLoc = v=>{ POKET.location = v; if(POKET.wallet && POKET.wallet.S) POKET.wallet.S.simulateGeoBlock = (v==='blocked'); locSel.value = v; };
  setLoc(p.get('location')==='blocked' || oc==='geoBlocked' ? 'blocked' : 'ok');
  locSel.onchange = ()=>setLoc(locSel.value);
  const bar = document.querySelector('.proto-bar');
  const setBar = ()=>document.documentElement.style.setProperty('--pk-bar', bar.offsetHeight + 'px');
  setBar(); new ResizeObserver(setBar).observe(bar);
  const want = p.get('surface');
  setSurface(['wallet','checkout-only'].includes(want) ? want : 'checkout');
})();

POKET.setProtoActions = function(list){
  const box = document.getElementById('protoActions'); if(!box) return;
  const sig = JSON.stringify((list||[]).map(a=>[a.label,(a.options||[]).map(o=>o[0])]));
  if(box.dataset.sig === sig) { box._list = list; return; }
  box.dataset.sig = sig; box._list = list;
  if(!list || !list.length){ box.hidden = true; box.innerHTML = ''; return; }
  box.hidden = false;
  box.innerHTML = '<span class="cap">Demo</span>' + list.map((a,i)=> a.options
    ? '<label class="proto-sel"><select data-pa="'+i+'" aria-label="'+a.label+'"><option value="">'+a.label+'\u2026</option>'+a.options.map(o=>'<option value="'+o[0]+'">'+o[1]+'</option>').join('')+'</select></label>'
    : '<button type="button" class="proto-act" data-pa="'+i+'">'+a.label+'</button>').join('');
  box.querySelectorAll('[data-pa]').forEach(el=>{
    const fire = ()=>{ const a = box._list[+el.dataset.pa]; if(!a) return; if(a.options){ const v=el.value; el.value=''; if(v) a.run(v); } else a.run(); };
    if(el.tagName==='SELECT') el.onchange = fire; else el.onclick = fire;
  });
};
</script>
